# Docker Compose v2+ (sin atributo version - obsoleto desde v2.0)
# Ancla YAML para reutilizar configuracion comun de la aplicacion
x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  volumes:
    - .:/app
    # AI-VECTOR-04: cache persistente de modelos ONNX de embeddings (fastembed).
    # Named volume sobre un subpath del bind-mount: evita bajar ~0.64 GB en cada
    # arranque y no ensucia el repo del host.
    - fastembed_cache:/app/.fastembed_cache
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  # DNS apunta al servidor Windows que tiene wildcard *.sintel.net.co → 192.168.2.15.
  # Cualquier tenant nuevo es resolvible dentro de los contenedores sin reiniciar.
  dns:
    - 192.168.2.15
    - 8.8.8.8

services:
  # Base de datos PostgreSQL
  db:
    container_name: crm_sintel-db-1
    # AI-VECTOR-01: imagen oficial del proyecto pgvector, PostgreSQL 16 + extension
    # `vector` ya compilada (Debian bookworm/glibc, reemplaza postgres:16-alpine/musl).
    # Pineada por digest para reproducibilidad (gate AI-VECTOR-01). Rollback: volver a
    # `postgres:16-alpine` + `docker compose up -d db` (el volumen no se toca).
    # Nota: este salto tambien sube 16.14 -> 16.15 (minor de PostgreSQL, drop-in) y
    # cambia el proveedor de collation musl -> glibc (requiere REINDEX, ver AI-VECTOR-01).
    image: pgvector/pgvector:pg16@sha256:ccc6e83d6e35e931dc7c5def2022729d5a6c370318d099181995567ff1fb4d6b
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-sintel}
      POSTGRES_USER: ${DATABASE_USER:-sintel}
      # DEVOPS-M1: sin fallback debil — falla explicito si falta en .env
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD debe estar definido en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # DEVOPS-M2: solo accesible desde el propio host, no desde la red local
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-sintel} -d ${POSTGRES_DB:-sintel} -c 'SELECT 1' -q 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Redis para Celery y cache
  redis:
    container_name: crm_sintel-redis-1
    image: redis:7.2-alpine
    ports:
      # DEVOPS-M2: solo accesible desde el propio host, no desde la red local
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Enterprise Knowledge Graph (EKG) — grafo de arquitectura/codigo, ver tools/ekg/
  neo4j:
    container_name: crm_sintel-neo4j-1
    image: neo4j:5.24-community
    environment:
      # EKG-M1: sin fallback debil, mismo patron que DATABASE_PASSWORD (DEVOPS-M1)
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD debe estar definido en .env}
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
    ports:
      # DEVOPS-M2: solo accesible desde el propio host, no desde la red local
      - "127.0.0.1:7474:7474"   # HTTP browser UI
      - "127.0.0.1:7687:7687"   # Bolt (driver)
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Servicio web Django
  web:
    <<: *app-base
    container_name: crm_sintel-web-1
    ports:
      # LAN_MULTI_TENANT (docs/network/): Django (runserver) NO debe ser
      # alcanzable desde la LAN -- Nginx (0.0.0.0:80/443) es el unico punto
      # de entrada documentado. Antes bindeaba 0.0.0.0:8000, exponiendo el
      # dev server crudo a toda la red local sin pasar por Nginx/TenantMiddleware
      # security headers. Restringido a loopback: sigue disponible para
      # depuracion directa desde ESTA maquina (http://localhost:8000).
      - "127.0.0.1:8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SERVICE_ROLE=web
      - DATABASE_HOST=db
      - FASTEMBED_CACHE_PATH=/app/.fastembed_cache  # AI-VECTOR-04
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    restart: unless-stopped
    extra_hosts:
      # Alta local de tenants (ver apps/public/tenants/management/commands/ensure_tenant_dns.py).
      # Registro local en desarrollo -- NO usar Cloudflare todavia (aun en desarrollo).
      - "home.sintel.net.co:192.168.2.200"
    # DEVOPS-M3: usa el endpoint /health ya existente (config/urls_public.py)
    # DEVOPS-M5: start_period=30s (retries=5*interval=10s -> 80s de margen
    # total) resultaba insuficiente frente al arranque REAL observado
    # (migrate_schemas de TODOS los tenants + garantizar dominios del
    # tenant publico + collectstatic corren SIEMPRE en cada arranque,
    # antes de que /health pueda responder -- medido >160s en un arranque
    # real de esta sesion). Cuando el margen se agotaba, `docker compose up`
    # reportaba "dependency web failed to start" para nginx (que exige
    # web: condition: service_healthy) y dejaba nginx en estado "Created"
    # sin arrancar, aunque web terminara arrancando bien segundos despues.
    # Ampliado con margen real, no ajustado al numero exacto observado una
    # sola vez.
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 180s

  # Reverse proxy HTTPS
  nginx:
    container_name: crm_sintel-nginx-1
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - nginx_certs:/etc/nginx/certs   # cert persiste entre rebuilds
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      # DEVOPS-M4: "depends_on: - web" solo esperaba a que el CONTENEDOR arrancara,
      # no a que Django estuviera realmente escuchando -- entrypoint.sh corre
      # migraciones/collectstatic antes de "runserver", asi que nginx podia quedar
      # aceptando trafico varios segundos antes de que el upstream respondiera,
      # devolviendo 502 Bad Gateway. condition: service_healthy hace que nginx
      # espere al healthcheck real de web (GET /health) antes de arrancar.
      web:
        condition: service_healthy
    restart: unless-stopped
    # DEVOPS-M3: wget de busybox (incluido en nginx:alpine), sin dependencias extra.
    # 127.0.0.1 explicito (no "localhost"): musl/Alpine resuelve "localhost" a
    # [::1] (IPv6) antes que a 127.0.0.1, y nginx solo escucha en 0.0.0.0 --
    # el healthcheck fallaba con "connection refused" aunque nginx respondia
    # correctamente en IPv4 (confirmado: netstat mostraba LISTEN en 0.0.0.0:80).
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Worker Celery
  celery:
    <<: *app-base
    container_name: crm_sintel-celery-1
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SERVICE_ROLE=celery
      - C_FORCE_ROOT=1
      - DATABASE_HOST=db
      - FASTEMBED_CACHE_PATH=/app/.fastembed_cache  # AI-VECTOR-04
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "high_priority,default"]
    restart: unless-stopped
    extra_hosts:
      # Alta local de tenants (ver apps/public/tenants/management/commands/ensure_tenant_dns.py).
      - "home.sintel.net.co:192.168.2.200"
    # DEVOPS-M3: celery inspect ping falla si el worker no responde
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Celery Beat -- scheduler de tareas periodicas (AI-VECTOR-11: reindexado
  # del Vector Store de los tenants con retrieval_enabled=True). Antes de
  # este cambio no habia ningun contenedor corriendo `celery beat`, asi que
  # los CELERY_BEAT_SCHEDULE ya definidos (dashboard, ai_knowledge) no se
  # disparaban.
  celery-beat:
    <<: *app-base
    container_name: crm_sintel-celery-beat-1
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SERVICE_ROLE=celery-beat
      - C_FORCE_ROOT=1
      - DATABASE_HOST=db
    command: ["celery", "-A", "config", "beat", "-l", "info"]
    restart: unless-stopped
    extra_hosts:
      - "home.sintel.net.co:192.168.2.200"

  # Cloudflare Tunnel
  cloudflared:
    container_name: crm_sintel-cloudflared-1
    image: cloudflare/cloudflared:2025.5.0
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx

  # n8n -- orquestador de automatizacion EXTERNO a SINTEL (N8N-SINTEL-01,
  # 2026-09-09). Version fijada (NO latest, ver docs/n8n/N8N_ARCHITECTURE.md).
  # Base de datos PROPIA y aislada (rol/DB Postgres dedicados, ver la
  # seccion "n8n" de .env -- CONNECT a la base `sintel` revocado
  # explicitamente para el rol `n8n`, verificado con evidencia real).
  # Puerto SOLO en 127.0.0.1 -- accesible desde el host para configuracion
  # inicial (UI de n8n), NUNCA desde la red LAN/Internet (mismo patron que
  # db/redis/neo4j). Exposicion publica via nginx queda DEFERRED (decision
  # explicita del usuario, ver N8N_RELEASE_GATE.md).
  n8n:
    container_name: crm_sintel-n8n-1
    image: n8nio/n8n:1.81.0
    environment:
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:?N8N_ENCRYPTION_KEY debe estar definido en .env}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD:?N8N_DB_PASSWORD debe estar definido en .env}
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - WEBHOOK_URL=${N8N_PROTOCOL:-http}://${N8N_HOST:-localhost}:${N8N_PORT:-5678}/
      - GENERIC_TIMEZONE=America/Bogota
      - TZ=America/Bogota
      - N8N_RUNNERS_ENABLED=true
      # N8N-SINTEL-02: variables de negocio que los workflows importados
      # (docs/n8n/workflows/) leen via $env.<NOMBRE> -- NO via env_file
      # (este servicio usa la imagen oficial de n8n, no el x-app-base de
      # arriba con env_file: .env, por eso cada una se pasa explicita).
      # Vacias por defecto: el workflow las usa cuando el usuario las
      # define en el .env real, nunca commiteadas con un valor real.
      - SINTEL_N8N_REFRESH_TOKEN=${SINTEL_N8N_REFRESH_TOKEN:-}
      - N8N_WEBHOOK_SECRET=${N8N_WEBHOOK_SECRET:-}
      - SINTEL_WHATSAPP_PHONE_NUMBER_ID=${SINTEL_WHATSAPP_PHONE_NUMBER_ID:-}
      - SINTEL_DEPT_CONTABILIDAD_EMAIL=${SINTEL_DEPT_CONTABILIDAD_EMAIL:-}
      - SINTEL_DEPT_CONTABILIDAD_WHATSAPP=${SINTEL_DEPT_CONTABILIDAD_WHATSAPP:-}
      - SINTEL_DEPT_ADMINISTRACION_EMAIL=${SINTEL_DEPT_ADMINISTRACION_EMAIL:-}
      - SINTEL_DEPT_ADMINISTRACION_WHATSAPP=${SINTEL_DEPT_ADMINISTRACION_WHATSAPP:-}
      - SINTEL_DEPT_TI_EMAIL=${SINTEL_DEPT_TI_EMAIL:-}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      # Solo host local -- ver comentario del servicio arriba.
      - "127.0.0.1:5678:5678"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://127.0.0.1:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  postgres_data:
    name: crm_sintel_postgres_data
    driver: local
  nginx_certs:
    name: crm_sintel_nginx_certs
    driver: local
  neo4j_data:
    name: crm_sintel_neo4j_data
    driver: local
  n8n_data:
    name: crm_sintel_n8n_data
    driver: local
  fastembed_cache:
    name: crm_sintel_fastembed_cache
    driver: local
