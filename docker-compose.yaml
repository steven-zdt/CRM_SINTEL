# Docker Compose v2+ (sin atributo version - obsoleto desde v2.0)
# Ancla YAML para reutilizar configuracion comun de la aplicacion
x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  # DNS apunta al servidor Windows que tiene wildcard *.sintel.net.co → 192.168.2.15.
  # Cualquier tenant nuevo es resolvible dentro de los contenedores sin reiniciar.
  dns:
    - 192.168.2.15
    - 8.8.8.8

services:
  # Base de datos PostgreSQL
  db:
    container_name: crm_sintel-db-1
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-sintel}
      POSTGRES_USER: ${DATABASE_USER:-sintel}
      # DEVOPS-M1: sin fallback debil — falla explicito si falta en .env
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD debe estar definido en .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      # DEVOPS-M2: solo accesible desde el propio host, no desde la red local
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-sintel} -d ${POSTGRES_DB:-sintel} -c 'SELECT 1' -q 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Redis para Celery y cache
  redis:
    container_name: crm_sintel-redis-1
    image: redis:7.2-alpine
    ports:
      # DEVOPS-M2: solo accesible desde el propio host, no desde la red local
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Enterprise Knowledge Graph (EKG) — grafo de arquitectura/codigo, ver tools/ekg/
  neo4j:
    container_name: crm_sintel-neo4j-1
    image: neo4j:5.24-community
    environment:
      # EKG-M1: sin fallback debil, mismo patron que DATABASE_PASSWORD (DEVOPS-M1)
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?NEO4J_PASSWORD debe estar definido en .env}
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_memory_heap_max__size: 512m
    volumes:
      - neo4j_data:/data
    ports:
      # DEVOPS-M2: solo accesible desde el propio host, no desde la red local
      - "127.0.0.1:7474:7474"   # HTTP browser UI
      - "127.0.0.1:7687:7687"   # Bolt (driver)
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  # Servicio web Django
  web:
    <<: *app-base
    container_name: crm_sintel-web-1
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SERVICE_ROLE=web
      - DATABASE_HOST=db
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    restart: unless-stopped
    # DEVOPS-M3: usa el endpoint /health ya existente (config/urls_public.py)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Reverse proxy HTTPS
  nginx:
    container_name: crm_sintel-nginx-1
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - nginx_certs:/etc/nginx/certs   # cert persiste entre rebuilds
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped
    # DEVOPS-M3: wget de busybox (incluido en nginx:alpine), sin dependencias extra
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # Worker Celery
  celery:
    <<: *app-base
    container_name: crm_sintel-celery-1
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SERVICE_ROLE=celery
      - C_FORCE_ROOT=1
      - DATABASE_HOST=db
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "high_priority,default"]
    restart: unless-stopped
    # DEVOPS-M3: celery inspect ping falla si el worker no responde
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # Cloudflare Tunnel
  cloudflared:
    container_name: crm_sintel-cloudflared-1
    image: cloudflare/cloudflared:2025.5.0
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${TUNNEL_TOKEN}
    restart: unless-stopped
    depends_on:
      - nginx



volumes:
  postgres_data:
    name: crm_sintel_postgres_data
    driver: local
  nginx_certs:
    name: crm_sintel_nginx_certs
    driver: local
  neo4j_data:
    name: crm_sintel_neo4j_data
    driver: local
