# Docker Compose v2+ (sin atributo version - obsoleto desde v2.0)
# Ancla YAML para reutilizar configuracion comun de la aplicacion
x-app-base: &app-base
  build:
    context: .
    dockerfile: Dockerfile
  env_file:
    - .env
  volumes:
    - .:/app
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  # extra_hosts: resolucion DNS interna de subdominios tenant
  # Agregar manualmente al crear nuevo tenant o ejecutar: python manage.py ensure_tenant_dns
  extra_hosts:
    - "sintel.com:192.168.2.15"
    - "cliente.sintel.com:192.168.2.15"
    - "putito.sintel.com:192.168.2.15"
    - "tupapi.sintel.com:192.168.2.15"

services:
  # Base de datos PostgreSQL
  db:
    container_name: crm_sintel-db-1
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-sintel}
      POSTGRES_USER: ${DATABASE_USER:-sintel}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-sintel}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "psql -U ${POSTGRES_USER:-sintel} -d ${POSTGRES_DB:-sintel} -c 'SELECT 1' -q 2>/dev/null"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # Redis para Celery y cache
  redis:
    container_name: crm_sintel-redis-1
    image: redis:7.2-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  # Servicio web Django
  web:
    <<: *app-base
    container_name: crm_sintel-web-1
    ports:
      - "0.0.0.0:8000:8000"
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SERVICE_ROLE=web
      - DATABASE_HOST=db
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    restart: unless-stopped

  # Reverse proxy HTTPS
  nginx:
    container_name: crm_sintel-nginx-1
    build:
      context: ./nginx
      dockerfile: Dockerfile
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    volumes:
      - ./staticfiles:/app/staticfiles:ro
      - ./media:/app/media:ro
    depends_on:
      - web
    restart: unless-stopped

  # Worker Celery
  celery:
    <<: *app-base
    container_name: crm_sintel-celery-1
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - SERVICE_ROLE=celery
      - C_FORCE_ROOT=1
      - DATABASE_HOST=db
    command: ["celery", "-A", "config", "worker", "-l", "info", "-Q", "high_priority,default"]
    restart: unless-stopped


volumes:
  postgres_data:
    name: crm_sintel_postgres_data
    driver: local
