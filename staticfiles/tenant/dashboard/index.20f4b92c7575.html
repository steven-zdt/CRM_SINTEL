<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="page-title">Dashboard - Sistema de Gestión</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📊</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .loading {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 50vh;
        }
        .spinner {
            border: 4px solid #f3f4f6;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .error-message {
            background: #fee2e2;
            color: #991b1b;
            border: 1px solid #fca5a5;
            padding: 16px;
            border-radius: 8px;
            margin: 20px;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen">
    <!-- Loading State -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
    </div>

    <!-- Error State -->
    <div id="error" class="error-message" style="display: none;">
        <h2>Error al cargar el dashboard</h2>
        <p id="error-text"></p>
        <button onclick="location.reload()" class="mt-4 px-4 py-2 bg-red-600 text-white rounded-lg">
            Reintentar
        </button>
    </div>

    <!-- Dashboard Content -->
    <div id="dashboard" style="display: none;">
        <!-- Header -->
        <header class="bg-white shadow-md">
            <div class="container mx-auto px-4 py-4">
                <div class="flex items-center justify-between">
                    <div class="flex items-center space-x-4">
                        <div id="header-logo">
                            <i class="fas fa-building text-2xl text-indigo-600"></i>
                        </div>
                        <h1 class="text-2xl font-bold text-gray-800" id="tenant-name">Cargando...</h1>
                        <span class="px-3 py-1 bg-gray-100 text-gray-800 rounded-full text-sm font-semibold" id="user-role-badge" style="display: none;">
                            <i class="fas fa-user mr-1"></i><span id="user-role-text"></span>
                        </span>
                    </div>
                    <div class="flex items-center space-x-4">
                        <span class="text-gray-600" id="user-email">Cargando...</span>
                        <button id="logout-btn" 
                                class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors">
                            <i class="fas fa-sign-out-alt mr-2"></i>Cerrar Sesión
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="container mx-auto px-4 py-8">
            <!-- Welcome Section -->
            <div class="bg-gradient-to-r from-indigo-600 to-purple-600 rounded-lg shadow-lg p-8 mb-8 text-white">
                <h2 class="text-3xl font-bold mb-2">
                    <i class="fas fa-tachometer-alt mr-2"></i>
                    Panel de Control
                </h2>
                <p class="text-indigo-100" id="welcome-text">
                    Bienvenido al dashboard
                </p>
            </div>

            <!-- Stats Grid -->
            <div class="grid md:grid-cols-4 gap-6 mb-8" id="stats-grid">
                <!-- Stats se cargan dinámicamente -->
            </div>

            <!-- Secciones del Dashboard (orden: empresas → facturas → contabilidad → perfil) -->
            <div id="dashboard-sections">
                <!-- Sección: Empresas -->
                <div class="bg-white rounded-lg shadow-md p-6 mb-8" id="section-empresas" style="display: none;">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-building mr-2 text-indigo-600"></i>
                        Empresas
                    </h3>
                    <div id="empresas-content"></div>
                </div>

                <!-- Sección: Facturas -->
                <div class="bg-white rounded-lg shadow-md p-6 mb-8" id="section-facturas" style="display: none;">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-file-invoice mr-2 text-blue-600"></i>
                        Facturas
                    </h3>
                    <div id="facturas-content"></div>
                </div>

                <!-- Sección: Contabilidad -->
                <div class="bg-white rounded-lg shadow-md p-6 mb-8" id="section-contabilidad" style="display: none;">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-book mr-2 text-green-600"></i>
                        Contabilidad
                    </h3>
                    <div id="contabilidad-content"></div>
                </div>

                <!-- Sección: Perfil -->
                <div class="bg-white rounded-lg shadow-md p-6 mb-8" id="section-perfil" style="display: none;">
                    <h3 class="text-xl font-bold text-gray-800 mb-4">
                        <i class="fas fa-user mr-2 text-purple-600"></i>
                        Mi Perfil
                    </h3>
                    <div id="perfil-content"></div>
                </div>
            </div>

            <!-- Quick Actions -->
            <div class="bg-white rounded-lg shadow-md p-6 mb-8">
                <h3 class="text-xl font-bold text-gray-800 mb-4">
                    <i class="fas fa-bolt mr-2 text-yellow-500"></i>
                    Acciones Rápidas
                </h3>
                <div class="grid md:grid-cols-3 gap-4" id="quick-actions">
                    <!-- Acciones se cargan dinámicamente -->
                </div>
            </div>
        </main>

        <!-- Footer -->
        <footer class="bg-white border-t mt-12">
            <div class="container mx-auto px-4 py-4 text-center text-gray-600 text-sm">
                <p id="footer-text">© 2026 Sistema de Gestión. Sistema de gestión contable y facturación electrónica.</p>
            </div>
        </footer>
    </div>

    <!-- ⚠️ POLÍTICA API-First: Módulos ES que consumen exclusivamente Core API -->
    <script type="module" src="/static/tenant/dashboard/js/dashboard.js"></script>
</body>
</html>
