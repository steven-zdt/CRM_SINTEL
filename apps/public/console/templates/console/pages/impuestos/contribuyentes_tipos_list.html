{% extends 'console/base.html' %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block extra_head %}
<script src="{% static 'js/http.js' %}"></script>
{% endblock %}

{% block content %}
<div class="px-4 py-6 sm:px-0">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Tipos de Contribuyente</h2>
        <button id="btn-nuevo" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">
            Nuevo Tipo
        </button>
    </div>
    
    <!-- Filtros -->
    <div class="bg-white shadow rounded-lg p-4 mb-6">
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
            <div>
                <label for="search" class="block text-sm font-medium text-gray-700">Buscar</label>
                <input type="text" id="search" placeholder="Nombre..." 
                       class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <label for="filter-clase" class="block text-sm font-medium text-gray-700">Clase</label>
                <select id="filter-clase" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    <option value="">Todas</option>
                    <option value="PN">Persona Natural</option>
                    <option value="PJ">Persona Jurídica</option>
                </select>
            </div>
            <div class="flex items-end">
                <button onclick="loadData()" class="w-full inline-flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">
                    Filtrar
                </button>
            </div>
        </div>
    </div>
    
    <!-- Tabla -->
    <div class="bg-white shadow rounded-lg overflow-hidden">
        <div id="loading" class="p-4 text-center text-gray-500">Cargando...</div>
        <div id="error" class="p-4 text-center text-red-500 hidden"></div>
        <table class="min-w-full divide-y divide-gray-200" id="table-data" style="display: none;">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Clase</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Segmento</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Activo</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                </tr>
            </thead>
            <tbody id="table-body" class="bg-white divide-y divide-gray-200">
            </tbody>
        </table>
        
        <!-- Paginación -->
        <div id="pagination" class="bg-white px-4 py-3 border-t border-gray-200 sm:px-6"></div>
    </div>
</div>

<!-- Modal para crear/editar -->
<div id="modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="mt-3">
            <h3 id="modal-title" class="text-lg font-medium text-gray-900 mb-4"></h3>
            <form id="form">
                <input type="hidden" id="form-id">
                <div class="mb-4">
                    <label for="form-nombre" class="block text-sm font-medium text-gray-700">Nombre</label>
                    <input type="text" id="form-nombre" required
                           class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div class="mb-4">
                    <label for="form-clase" class="block text-sm font-medium text-gray-700">Clase</label>
                    <select id="form-clase" required
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="">Seleccione...</option>
                        <option value="PN">Persona Natural</option>
                        <option value="PJ">Persona Jurídica</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label for="form-segmento" class="block text-sm font-medium text-gray-700">Segmento DIAN</label>
                    <select id="form-segmento" required
                            class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                        <option value="">Seleccione...</option>
                        <option value="GRAN_CONTRIBUYENTE">Gran contribuyente</option>
                        <option value="MEDIANO_ALTO">Contribuyente mediano alto</option>
                        <option value="MEDIANO">Contribuyente mediano</option>
                        <option value="PEQUENO">Contribuyente pequeño</option>
                        <option value="MICRO">Contribuyente micro</option>
                        <option value="OTRO">Otro / No aplica</option>
                    </select>
                </div>
                <div class="mb-4">
                    <label class="flex items-center">
                        <input type="checkbox" id="form-activo" class="rounded border-gray-300 text-indigo-600 focus:ring-indigo-500">
                        <span class="ml-2 text-sm text-gray-700">Activo</span>
                    </label>
                </div>
                <div class="flex justify-end space-x-2">
                    <button type="button" onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                        Cancelar
                    </button>
                    <button type="submit" class="px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">
                        Guardar
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// http.js ya está cargado globalmente como window.http

const API_BASE = '/api/public/v1/impuestos/contribuyentes-tipos/';
let currentPage = 1;

document.addEventListener('DOMContentLoaded', function() {
    loadData();
    
    // Event listeners
    document.getElementById('btn-nuevo').addEventListener('click', () => openModal());
    document.getElementById('form').addEventListener('submit', handleSubmit);
    document.getElementById('search').addEventListener('keyup', (e) => {
        if (e.key === 'Enter') loadData();
    });
});

async function loadData(page = 1) {
    currentPage = page;
    const search = document.getElementById('search').value;
    const clase = document.getElementById('filter-clase').value;
    
    document.getElementById('loading').style.display = 'block';
    document.getElementById('error').classList.add('hidden');
    document.getElementById('table-data').style.display = 'none';
    
    try {
        const params = { page };
        if (search) params.search = search;
        if (clase) params.clase = clase;
        
        const data = await http.get(API_BASE, params);
        
        renderTable(data.results || []);
        renderPagination(data);
        
        document.getElementById('loading').style.display = 'none';
        document.getElementById('table-data').style.display = 'table';
    } catch (error) {
        document.getElementById('loading').style.display = 'none';
        document.getElementById('error').textContent = error.message;
        document.getElementById('error').classList.remove('hidden');
    }
}

function renderTable(items) {
    const tbody = document.getElementById('table-body');
    if (items.length === 0) {
        tbody.innerHTML = '<tr><td colspan="6" class="px-6 py-4 text-center text-gray-500">No hay datos</td></tr>';
        return;
    }
    
    tbody.innerHTML = items.map(item => `
        <tr>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.id}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.nombre || '-'}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${item.clase === 'PN' ? 'Persona Natural' : 'Persona Jurídica'}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-900">${getSegmentoDisplay(item.segmento_dian)}</td>
            <td class="px-6 py-4 whitespace-nowrap text-sm">
                <span class="px-2 inline-flex text-xs leading-5 font-semibold rounded-full ${item.activo ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
                    ${item.activo ? 'Activo' : 'Inactivo'}
                </span>
            </td>
            <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">
                <button onclick="editItem(${item.id})" class="text-indigo-600 hover:text-indigo-900 mr-3">Editar</button>
                <button onclick="toggleActive(${item.id}, ${!item.activo})" class="text-${item.activo ? 'red' : 'green'}-600 hover:text-${item.activo ? 'red' : 'green'}-900">
                    ${item.activo ? 'Desactivar' : 'Activar'}
                </button>
            </td>
        </tr>
    `).join('');
}

function getSegmentoDisplay(codigo) {
    const map = {
        'GRAN_CONTRIBUYENTE': 'Gran contribuyente',
        'MEDIANO_ALTO': 'Contribuyente mediano alto',
        'MEDIANO': 'Contribuyente mediano',
        'PEQUENO': 'Contribuyente pequeño',
        'MICRO': 'Contribuyente micro',
        'OTRO': 'Otro / No aplica',
    };
    return map[codigo] || codigo;
}

function renderPagination(data) {
    const container = document.getElementById('pagination');
    if (!data.next && !data.previous) {
        container.innerHTML = '';
        return;
    }
    
    let html = '<div class="flex items-center justify-between">';
    html += `<div class="text-sm text-gray-700">Página ${currentPage} (${data.count || 0} resultados)</div>`;
    html += '<div class="flex space-x-2">';
    
    if (data.previous) {
        html += `<button onclick="loadData(${currentPage - 1})" class="px-3 py-1 border border-gray-300 rounded-md text-sm text-gray-700 hover:bg-gray-50">Anterior</button>`;
    }
    
    if (data.next) {
        html += `<button onclick="loadData(${currentPage + 1})" class="px-3 py-1 border border-gray-300 rounded-md text-sm text-gray-700 hover:bg-gray-50">Siguiente</button>`;
    }
    
    html += '</div></div>';
    container.innerHTML = html;
}

function openModal(item = null) {
    const modal = document.getElementById('modal');
    const form = document.getElementById('form');
    
    if (item) {
        document.getElementById('modal-title').textContent = 'Editar Tipo de Contribuyente';
        document.getElementById('form-id').value = item.id;
        document.getElementById('form-nombre').value = item.nombre || '';
        document.getElementById('form-clase').value = item.clase || '';
        document.getElementById('form-segmento').value = item.segmento_dian || '';
        document.getElementById('form-activo').checked = item.activo !== false;
    } else {
        document.getElementById('modal-title').textContent = 'Nuevo Tipo de Contribuyente';
        form.reset();
        document.getElementById('form-id').value = '';
        document.getElementById('form-activo').checked = true;
    }
    
    modal.classList.remove('hidden');
}

function closeModal() {
    document.getElementById('modal').classList.add('hidden');
}

async function handleSubmit(e) {
    e.preventDefault();
    
    const id = document.getElementById('form-id').value;
    const data = {
        nombre: document.getElementById('form-nombre').value,
        clase: document.getElementById('form-clase').value,
        segmento_dian: document.getElementById('form-segmento').value,
        activo: document.getElementById('form-activo').checked,
    };
    
    try {
        if (id) {
            await http.patch(`${API_BASE}${id}/`, data);
        } else {
            await http.post(API_BASE, data);
        }
        
        closeModal();
        loadData(currentPage);
    } catch (error) {
        alert(`Error: ${error.message}`);
    }
}

async function editItem(id) {
    try {
        const item = await http.get(`${API_BASE}${id}/`);
        openModal(item);
    } catch (error) {
        alert(`Error al cargar: ${error.message}`);
    }
}

async function toggleActive(id, activo) {
    if (!confirm(`¿${activo ? 'Activar' : 'Desactivar'} este tipo de contribuyente?`)) {
        return;
    }
    
    try {
        await http.patch(`${API_BASE}${id}/`, { activo });
        loadData(currentPage);
    } catch (error) {
        alert(`Error: ${error.message}`);
    }
}

// Exponer funciones globalmente para onclick
window.loadData = loadData;
window.openModal = openModal;
window.closeModal = closeModal;
window.editItem = editItem;
window.toggleActive = toggleActive;
</script>
{% endblock %}
