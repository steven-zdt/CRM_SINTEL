{% extends 'console/base.html' %}
{% load static %}

{% block title %}{{ page_title }}{% endblock %}

{% block content %}
<div class="px-4 py-6 sm:px-0">
    <div class="flex justify-between items-center mb-6">
        <h2 class="text-2xl font-bold text-gray-900">Gestión de Empresas</h2>
        <button onclick="openCreateTenantModal()" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">
            Nueva Empresa
        </button>
    </div>
    
    <!-- Filtros -->
    <div class="bg-white shadow rounded-lg p-4 mb-6">
        <div class="grid grid-cols-1 gap-4 sm:grid-cols-3">
            <div>
                <label for="search-tenant" class="block text-sm font-medium text-gray-700">Buscar</label>
                <input type="text" id="search-tenant" placeholder="Nombre o schema..." 
                       class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
            </div>
            <div>
                <label for="filter-trial" class="block text-sm font-medium text-gray-700">Estado</label>
                <select id="filter-trial" class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    <option value="">Todos</option>
                    <option value="true">En Prueba</option>
                    <option value="false">Pagados</option>
                </select>
            </div>
            <div class="flex items-end">
                <button onclick="loadTenants()" class="w-full inline-flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md text-white bg-indigo-600 hover:bg-indigo-700">
                    Filtrar
                </button>
            </div>
        </div>
    </div>
    
    <!-- Tabla de Empresas -->
    <div class="bg-white shadow rounded-lg overflow-hidden">
        <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
                <tr>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nombre</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Schema</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Dominio</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Estado</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Creado</th>
                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Acciones</th>
                </tr>
            </thead>
            <tbody id="tenants-table-body" class="bg-white divide-y divide-gray-200">
                <tr>
                    <td colspan="6" class="px-6 py-4 text-center text-gray-500">Cargando...</td>
                </tr>
            </tbody>
        </table>
        
        <!-- Paginación -->
        <div id="tenants-pagination" class="bg-white px-4 py-3 border-t border-gray-200 sm:px-6"></div>
    </div>
</div>

<!-- Modal para crear empresa -->
<div id="create-tenant-modal" class="hidden fixed inset-0 bg-gray-600 bg-opacity-50 overflow-y-auto h-full w-full z-50">
    <div class="relative top-20 mx-auto p-5 border w-96 shadow-lg rounded-md bg-white">
        <div class="mt-3">
            <h3 class="text-lg font-medium text-gray-900 mb-4">Nueva Empresa</h3>
            <form id="create-tenant-form" onsubmit="createTenant(event)">
                <div class="mb-4">
                    <label for="tenant-nombre" class="block text-sm font-medium text-gray-700">Nombre de la Empresa</label>
                    <input type="text" id="tenant-nombre" required
                           class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div class="mb-4">
                    <label for="tenant-schema-name" class="block text-sm font-medium text-gray-700">
                        Schema Name (Opcional)
                        <span class="text-xs text-gray-500">Se genera automáticamente desde el nombre si no se proporciona</span>
                    </label>
                    <input type="text" id="tenant-schema-name" placeholder="ej: mi_empresa (sin puntos)"
                           class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                    <p class="mt-1 text-xs text-gray-500">
                        El dominio se creará automáticamente como: <span id="preview-domain" class="font-mono text-indigo-600"></span>
                    </p>
                </div>
                <div class="mb-4">
                    <label for="tenant-email" class="block text-sm font-medium text-gray-700">Email Administrador</label>
                    <input type="email" id="tenant-email" required
                           class="mt-1 block w-full border-gray-300 rounded-md shadow-sm focus:ring-indigo-500 focus:border-indigo-500 sm:text-sm">
                </div>
                <div class="flex justify-end space-x-3">
                    <button type="button" onclick="closeCreateTenantModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50">
                        Cancelar
                    </button>
                    <button type="submit" class="px-4 py-2 border border-transparent rounded-md text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700">
                        Crear
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
// Cargar empresas al cargar la página
document.addEventListener('DOMContentLoaded', function() {
    loadTenants();
    
    // Event listeners para filtros
    document.getElementById('search-tenant').addEventListener('keyup', function(e) {
        if (e.key === 'Enter') loadTenants();
    });
});

function openCreateTenantModal() {
    document.getElementById('create-tenant-modal').classList.remove('hidden');
}

function closeCreateTenantModal() {
    document.getElementById('create-tenant-modal').classList.add('hidden');
    document.getElementById('create-tenant-form').reset();
}

function createTenant(event) {
    event.preventDefault();
    const nombre = document.getElementById('tenant-nombre').value;
    const schemaName = document.getElementById('tenant-schema-name').value.trim() || null;
    const email = document.getElementById('tenant-email').value;
    
    // Mostrar loading
    const submitBtn = event.target.querySelector('button[type="submit"]');
    const originalText = submitBtn.textContent;
    submitBtn.disabled = true;
    submitBtn.textContent = 'Creando...';
    
    consoleAPI.createTenant(nombre, email, schemaName)
        .then(() => {
            closeCreateTenantModal();
            loadTenants();
            alert('Empresa creada exitosamente');
        })
        .catch(error => {
            alert('Error al crear empresa: ' + (error.message || 'Error desconocido'));
        })
        .finally(() => {
            submitBtn.disabled = false;
            submitBtn.textContent = originalText;
        });
}

// ⚠️ v2.17: Preview del dominio que se creará automáticamente
function updateDomainPreview() {
    const nombre = document.getElementById('tenant-nombre').value;
    const schemaName = document.getElementById('tenant-schema-name').value.trim();
    const previewEl = document.getElementById('preview-domain');
    
    if (!previewEl) return;
    
    // Generar preview del dominio (simplificado, el backend lo hace correctamente)
    let preview = '...';
    if (nombre || schemaName) {
        // Intentar generar schema_name desde nombre si no hay schema_name
        let schema = schemaName;
        if (!schema && nombre) {
            // Simplificación: convertir nombre a slug básico
            schema = nombre.toLowerCase()
                .replace(/[^a-z0-9]+/g, '_')
                .replace(/^_+|_+$/g, '')
                .substring(0, 63);
        }
        if (schema) {
            preview = schema + '.sintel.localhost';
        }
    }
    
    previewEl.textContent = preview;
}

// Agregar event listeners para preview
document.addEventListener('DOMContentLoaded', function() {
    const nombreInput = document.getElementById('tenant-nombre');
    const schemaInput = document.getElementById('tenant-schema-name');
    
    if (nombreInput) {
        nombreInput.addEventListener('input', updateDomainPreview);
    }
    if (schemaInput) {
        schemaInput.addEventListener('input', updateDomainPreview);
    }
});

function loadTenants() {
    const search = document.getElementById('search-tenant').value;
    const trial = document.getElementById('filter-trial').value;
    
    consoleAPI.loadTenants(search, trial);
}
</script>
{% endblock %}
