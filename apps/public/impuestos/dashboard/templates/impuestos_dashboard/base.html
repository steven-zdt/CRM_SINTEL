<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}Biblioteca Tributaria | Ingesta{% endblock %}</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'impuestos_dashboard/styles.css' %}"/>
  <!-- HTMX & Alpine -->
  <script src="https://unpkg.com/htmx.org@1.9.10"></script>
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="container">
  <header>
    <h1>Biblioteca Tributaria – Ingesta</h1>
  </header>
  <nav>
    <a href="{% url 'impuestos_dashboard:ingesta_list' %}">Listado</a> |
    <a href="{% url 'impuestos_dashboard:ingesta_create' %}">Nuevo</a>
  </nav>
  <main>
    {% if messages %}
      <div class="messages">
        {% for message in messages %}
          <div class="alert alert-{{ message.tags }}">{{ message }}</div>
        {% endfor %}
      </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
