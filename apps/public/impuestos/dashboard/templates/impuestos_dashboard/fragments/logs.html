<h3>Logs</h3>
<table class="table">
  <thead>
    <tr>
      <th>Fecha</th>
      <th>Etapa</th>
      <th>Nivel</th>
      <th>Mensaje</th>
    </tr>
  </thead>
  <tbody>
    {% for log in logs %}
      <tr class="log-{{log.nivel|lower}}">
        <td>{{log.ts|date:"Y-m-d H:i:s"}}</td>
        <td>{{log.etapa}}</td>
        <td><span class="badge badge-{{log.nivel|lower}}">{{log.nivel}}</span></td>
        <td><pre class="log">{{log.mensaje}}</pre></td>
      </tr>
    {% empty %}
      <tr><td colspan="4">Sin eventos.</td></tr>
    {% endfor %}
  </tbody>
</table>
