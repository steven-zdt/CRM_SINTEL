<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activar Cuenta - SINTEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #3b5bdb 0%, #1971c2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .activation-card {
            background: #fff;
            border-radius: 16px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.15);
            padding: 2.5rem;
            max-width: 460px;
            width: 100%;
        }
        .code-input {
            font-size: 2rem;
            font-weight: 700;
            letter-spacing: 0.5rem;
            text-align: center;
            font-family: 'Courier New', monospace;
        }
        .form-control:focus { border-color: #3b5bdb; box-shadow: 0 0 0 0.2rem rgba(59,91,219,0.2); }
        .btn-primary { background: #3b5bdb; border-color: #3b5bdb; }
        .btn-primary:hover { background: #1971c2; border-color: #1971c2; transform: translateY(-1px); }
        .step-badge { background: #e7f5ff; color: #1864ab; font-weight: 600; border-radius: 50%; width: 28px; height: 28px; display: inline-flex; align-items: center; justify-content: center; font-size: .85rem; margin-right: 8px; }
    </style>
</head>
<body>
    <div class="activation-card">
        <div class="text-center mb-4">
            <i class="fas fa-shield-alt fa-2x text-primary mb-3"></i>
            <h4 class="fw-bold mb-1">Activar Cuenta</h4>
            <p class="text-muted small mb-0">Ingresa el codigo que recibiste por email</p>
        </div>

        {% if error %}
            <div class="alert alert-danger rounded-3" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>{{ error }}
            </div>
        {% endif %}

        <form id="activationForm" novalidate>
            <div class="mb-3">
                <label for="email" class="form-label small fw-semibold">
                    <span class="step-badge">1</span>Tu Email
                </label>
                <input type="email" class="form-control" id="email" name="email"
                       value="{{ user_email|default:'' }}"
                       placeholder="tu@correo.com" required
                       {% if user_email %}readonly{% endif %}>
            </div>

            <div class="mb-3">
                <label for="code" class="form-label small fw-semibold">
                    <span class="step-badge">2</span>Codigo de Activacion (8 caracteres)
                </label>
                <input type="text" class="form-control code-input" id="code" name="code"
                       maxlength="8" pattern="[A-Za-z0-9]{8}" placeholder="AKBT3M7Q"
                       autocomplete="one-time-code" spellcheck="false"
                       style="text-transform:uppercase" required>
                <div class="form-text">Codigo de 8 caracteres del email. Revisa tu bandeja de entrada (y spam).</div>
            </div>

            <div class="mb-3">
                <label for="password" class="form-label small fw-semibold">
                    <span class="step-badge">3</span>Nueva Contrasena
                </label>
                <div class="input-group">
                    <input type="password" class="form-control" id="password" name="password"
                           placeholder="Minimo 8 caracteres" minlength="8" required>
                    <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="mb-4">
                <label for="confirmPassword" class="form-label small fw-semibold">
                    <span class="step-badge">4</span>Confirmar Contrasena
                </label>
                <input type="password" class="form-control" id="confirmPassword"
                       placeholder="Repite la contrasena" required>
            </div>

            <div class="d-grid">
                <button type="submit" class="btn btn-primary py-2 fw-semibold" id="activateBtn">
                    <span class="spinner-border spinner-border-sm d-none me-2" id="loadingSpinner"></span>
                    <i class="fas fa-unlock-alt me-2"></i>Activar Cuenta
                </button>
            </div>
        </form>

        <div class="alert alert-success d-none rounded-3 mt-3" id="successAlert" role="alert">
            <i class="fas fa-check-circle me-2"></i><span id="successMessage"></span>
        </div>
        <div class="alert alert-danger d-none rounded-3 mt-3" id="errorAlert" role="alert">
            <i class="fas fa-exclamation-triangle me-2"></i><span id="errorMessage"></span>
        </div>

        <div class="text-center mt-4">
            <small class="text-muted">
                Necesitas ayuda?
                <a href="mailto:soporte@sintel.com" class="text-decoration-none">Contactar Soporte</a>
            </small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
    (function () {
        'use strict';

        const form = document.getElementById('activationForm');
        const passwordInput = document.getElementById('password');
        const confirmPasswordInput = document.getElementById('confirmPassword');
        const codeInput = document.getElementById('code');
        const activateBtn = document.getElementById('activateBtn');
        const loadingSpinner = document.getElementById('loadingSpinner');
        const successAlert = document.getElementById('successAlert');
        const errorAlert = document.getElementById('errorAlert');

        // Normalizar a mayusculas y filtrar solo caracteres del alfabeto permitido
        codeInput.addEventListener('input', function () {
            this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
        });

        document.getElementById('togglePassword').addEventListener('click', function () {
            const type = passwordInput.type === 'password' ? 'text' : 'password';
            passwordInput.type = type;
            confirmPasswordInput.type = type;
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            successAlert.classList.add('d-none');
            errorAlert.classList.add('d-none');

            const email = document.getElementById('email').value.trim();
            const code = codeInput.value.trim();
            const password = passwordInput.value;
            const confirmPassword = confirmPasswordInput.value;

            if (!email || !code || !password || !confirmPassword) {
                showError('Todos los campos son obligatorios.');
                return;
            }
            if (!/^[A-Z0-9]{8}$/.test(code)) {
                showError('El codigo debe tener exactamente 8 caracteres alfanumericos.');
                return;
            }
            if (password !== confirmPassword) {
                showError('Las contrasenas no coinciden.');
                return;
            }
            if (password.length < 8) {
                showError('La contrasena debe tener al menos 8 caracteres.');
                return;
            }

            activateBtn.disabled = true;
            loadingSpinner.classList.remove('d-none');

            try {
                const resp = await fetch('/activate/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, code, password }),
                });
                const data = await resp.json();

                if (data.success) {
                    showSuccess(data.message || 'Cuenta activada correctamente.');
                    setTimeout(() => { window.location.href = data.redirect_url || '/'; }, 2000);
                } else {
                    showError(data.error || 'Error activando la cuenta.');
                }
            } catch (err) {
                showError('Error de conexion. Intenta nuevamente.');
            } finally {
                activateBtn.disabled = false;
                loadingSpinner.classList.add('d-none');
            }
        });

        function showSuccess(msg) {
            document.getElementById('successMessage').textContent = msg;
            successAlert.classList.remove('d-none');
        }
        function showError(msg) {
            document.getElementById('errorMessage').textContent = msg;
            errorAlert.classList.remove('d-none');
        }
    })();
    </script>
</body>
</html>
