<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activar Cuenta - SINTEL</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .activation-card {
            background: white;
            border-radius: 15px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.1);
            padding: 2rem;
            max-width: 450px;
            width: 100%;
        }
        .logo-section {
            text-align: center;
            margin-bottom: 2rem;
        }
        .logo-section h1 {
            color: #667eea;
            font-weight: bold;
            margin-bottom: 0.5rem;
        }
        .form-control:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 0.2rem rgba(102, 126, 234, 0.25);
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border: none;
            padding: 12px 30px;
            border-radius: 25px;
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }
        .alert {
            border-radius: 10px;
        }
    </style>
</head>
<body>
    <div class="activation-card">
        <div class="logo-section">
            <i class="fas fa-key fa-3x text-primary mb-3"></i>
            <h1>SINTEL</h1>
            <p class="text-muted">Activar Cuenta</p>
        </div>

        {% if error %}
            <div class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                {{ error }}
            </div>
        {% else %}
            <form id="activationForm">
                <div class="mb-3">
                    <label for="email" class="form-label">Email</label>
                    <input type="email" class="form-control" id="email" value="{{ user_email }}" readonly>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label">Nueva Contraseña</label>
                    <div class="input-group">
                        <input type="password" class="form-control" id="password" required 
                               placeholder="Ingrese su nueva contraseña" minlength="8">
                        <button class="btn btn-outline-secondary" type="button" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="form-text">Mínimo 8 caracteres</div>
                </div>

                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirmar Contraseña</label>
                    <input type="password" class="form-control" id="confirmPassword" required 
                           placeholder="Confirme su nueva contraseña">
                </div>

                <input type="hidden" id="token" value="{{ token }}">

                <div class="d-grid">
                    <button type="submit" class="btn btn-primary" id="activateBtn">
                        <span class="spinner-border spinner-border-sm d-none me-2" id="loadingSpinner"></span>
                        Activar Cuenta
                    </button>
                </div>
            </form>

            <div class="alert alert-success d-none" id="successAlert" role="alert">
                <i class="fas fa-check-circle me-2"></i>
                <span id="successMessage"></span>
            </div>

            <div class="alert alert-danger d-none" id="errorAlert" role="alert">
                <i class="fas fa-exclamation-triangle me-2"></i>
                <span id="errorMessage"></span>
            </div>
        {% endif %}

        <div class="text-center mt-4">
            <small class="text-muted">
                ¿Necesita ayuda? <a href="mailto:soporte@sintel.com">Contactar Soporte</a>
            </small>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.getElementById('activationForm');
            const passwordInput = document.getElementById('password');
            const confirmPasswordInput = document.getElementById('confirmPassword');
            const togglePasswordBtn = document.getElementById('togglePassword');
            const activateBtn = document.getElementById('activateBtn');
            const loadingSpinner = document.getElementById('loadingSpinner');
            const successAlert = document.getElementById('successAlert');
            const errorAlert = document.getElementById('errorAlert');
            const successMessage = document.getElementById('successMessage');
            const errorMessage = document.getElementById('errorMessage');

            // Toggle password visibility
            if (togglePasswordBtn) {
                togglePasswordBtn.addEventListener('click', function() {
                    const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
                    passwordInput.setAttribute('type', type);
                    confirmPasswordInput.setAttribute('type', type);
                    
                    const icon = this.querySelector('i');
                    icon.classList.toggle('fa-eye');
                    icon.classList.toggle('fa-eye-slash');
                });
            }

            // Form submission
            if (form) {
                form.addEventListener('submit', function(e) {
                    e.preventDefault();
                    
                    const password = passwordInput.value;
                    const confirmPassword = confirmPasswordInput.value;
                    const token = document.getElementById('token').value;

                    // Hide previous alerts
                    successAlert.classList.add('d-none');
                    errorAlert.classList.add('d-none');

                    // Validate passwords match
                    if (password !== confirmPassword) {
                        showError('Las contraseñas no coinciden');
                        return;
                    }

                    // Validate password length
                    if (password.length < 8) {
                        showError('La contraseña debe tener al menos 8 caracteres');
                        return;
                    }

                    // Show loading state
                    activateBtn.disabled = true;
                    loadingSpinner.classList.remove('d-none');

                    // Submit activation
                    fetch('/activate/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            token: token,
                            password: password
                        })
                    })
                    .then(response => response.json())
                    .then(data => {
                        if (data.success) {
                            showSuccess(data.message);
                            setTimeout(() => {
                                window.location.href = data.redirect_url;
                            }, 2000);
                        } else {
                            showError(data.error || 'Error activando cuenta');
                        }
                    })
                    .catch(error => {
                        console.error('Error:', error);
                        showError('Error de conexión. Intente nuevamente.');
                    })
                    .finally(() => {
                        activateBtn.disabled = false;
                        loadingSpinner.classList.add('d-none');
                    });
                });
            }

            function showSuccess(message) {
                successMessage.textContent = message;
                successAlert.classList.remove('d-none');
            }

            function showError(message) {
                errorMessage.textContent = message;
                errorAlert.classList.remove('d-none');
            }
        });
    </script>
</body>
</html>
