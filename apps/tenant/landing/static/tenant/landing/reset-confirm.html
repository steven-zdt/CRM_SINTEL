<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Definir Nueva Contraseña</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="max-w-md w-full">
            <div class="bg-white rounded-lg shadow-xl p-8">
                <div class="text-center mb-6">
                    <div class="inline-block bg-indigo-600 text-white rounded-full p-4 mb-4">
                        <i class="fas fa-lock text-4xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">Nueva Contraseña</h1>
                    <p class="text-gray-600">Define tu nueva contraseña</p>
                </div>

                <div id="invalid_token" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm hidden" role="alert">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    Token inválido o expirado. Solicita un nuevo restablecimiento.
                </div>

                <form id="reset_confirm_form" class="space-y-4 hidden">
                    <div>
                        <label for="reset_password1" class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña</label>
                        <input 
                            type="password" 
                            id="reset_password1" 
                            name="password1" 
                            required 
                            autocomplete="new-password"
                            minlength="8"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            placeholder="Mínimo 8 caracteres"
                        >
                    </div>
                    <div>
                        <label for="reset_password2" class="block text-sm font-medium text-gray-700 mb-1">Confirmar Contraseña</label>
                        <input 
                            type="password" 
                            id="reset_password2" 
                            name="password2" 
                            required 
                            autocomplete="new-password"
                            minlength="8"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            placeholder="Repite la contraseña"
                        >
                    </div>
                    <div id="reset_error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm hidden" role="alert">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="reset_error_text"></span>
                    </div>
                    <div id="reset_success" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg text-sm hidden" role="alert">
                        <i class="fas fa-check-circle mr-2"></i>
                        <span id="reset_success_text"></span>
                    </div>
                    <button 
                        type="submit" 
                        id="reset_submit_btn"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 disabled:cursor-not-allowed text-white font-semibold py-3 px-8 rounded-lg transition-colors duration-200 shadow-lg"
                    >
                        <i class="fas fa-save mr-2"></i>
                        Guardar y Continuar
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="/static/tenant/landing/login.html" class="text-indigo-600 hover:text-indigo-800 text-sm">
                        <i class="fas fa-arrow-left mr-1"></i>
                        Volver al inicio de sesión
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            
            function getCookie(name) {
                const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
                return m ? m.pop() : '';
            }
            
            const qs = new URLSearchParams(location.search);
            const uid = qs.get('uidb64') || qs.get('uid');
            const token = qs.get('token');
            
            const invalidTokenEl = document.getElementById('invalid_token');
            const resetForm = document.getElementById('reset_confirm_form');
            const submitBtn = document.getElementById('reset_submit_btn');
            const resetError = document.getElementById('reset_error');
            const resetErrorText = document.getElementById('reset_error_text');
            const resetSuccess = document.getElementById('reset_success');
            const resetSuccessText = document.getElementById('reset_success_text');
            
            // Validar token al cargar
            async function validateToken() {
                if (!uid || !token) {
                    if (invalidTokenEl) invalidTokenEl.classList.remove('hidden');
                    return false;
                }
                
                try {
                    const csrftoken = getCookie('csrftoken') || '';
                    const response = await fetch('/api/v1/core/auth/password-reset/validate/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrftoken,
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({ uid, token })
                    });
                    
                    if (response.ok) {
                        if (resetForm) resetForm.classList.remove('hidden');
                        return true;
                    } else {
                        if (invalidTokenEl) invalidTokenEl.classList.remove('hidden');
                        return false;
                    }
                } catch (error) {
                    if (invalidTokenEl) invalidTokenEl.classList.remove('hidden');
                    return false;
                }
            }
            
            // Confirmar reset
            resetForm?.addEventListener('submit', async (ev) => {
                ev.preventDefault();
                if (resetError) resetError.classList.add('hidden');
                if (resetSuccess) resetSuccess.classList.add('hidden');
                
                const password1 = document.getElementById('reset_password1').value;
                const password2 = document.getElementById('reset_password2').value;
                
                if (password1.length < 8) {
                    if (resetErrorText) resetErrorText.textContent = 'La contraseña debe tener al menos 8 caracteres.';
                    if (resetError) resetError.classList.remove('hidden');
                    return;
                }
                
                if (password1 !== password2) {
                    if (resetErrorText) resetErrorText.textContent = 'Las contraseñas no coinciden.';
                    if (resetError) resetError.classList.remove('hidden');
                    return;
                }
                
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Guardando...';
                }
                
                try {
                    const csrftoken = getCookie('csrftoken') || '';
                    const response = await fetch('/api/v1/core/auth/password-reset/confirm/', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrftoken,
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({ 
                            uid: uid,
                            token: token,
                            password1: password1,
                            password2: password2
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        if (resetSuccessText) resetSuccessText.textContent = data.detail || 'Contraseña restablecida exitosamente.';
                        if (resetSuccess) resetSuccess.classList.remove('hidden');
                        if (resetForm) resetForm.classList.add('hidden');
                        
                        // Redirigir después de 3 segundos
                        setTimeout(() => {
                            const redirectUrl = data.redirect_url || '/static/tenant/landing/login.html';
                            window.location.href = redirectUrl;
                        }, 3000);
                    } else {
                        if (resetErrorText) resetErrorText.textContent = data.detail || 'Error al restablecer la contraseña.';
                        if (resetError) resetError.classList.remove('hidden');
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i>Guardar y Continuar';
                        }
                    }
                } catch (error) {
                    if (resetErrorText) resetErrorText.textContent = 'Error de red. Intenta nuevamente.';
                    if (resetError) resetError.classList.remove('hidden');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i>Guardar y Continuar';
                    }
                }
            });
            
            // Validar token al cargar
            validateToken();
        })();
    </script>
</body>
</html>
