<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activar Cuenta</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="max-w-md w-full">
            <div class="bg-white rounded-lg shadow-xl p-8">
                <div class="text-center mb-6">
                    <div class="inline-block bg-indigo-600 text-white rounded-full p-4 mb-4">
                        <i class="fas fa-user-check text-4xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">Activar Cuenta</h1>
                    <p class="text-gray-600">Define tu contraseña para activar tu cuenta</p>
                </div>

                <div id="invalid_token" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm hidden" role="alert">
                    <i class="fas fa-exclamation-circle mr-2"></i>
                    <span id="invalid_token_text">Token inválido o expirado.</span>
                </div>

                <div id="already_activated" class="bg-yellow-50 border border-yellow-200 text-yellow-700 px-4 py-3 rounded-lg text-sm hidden" role="alert">
                    <i class="fas fa-info-circle mr-2"></i>
                    Tu cuenta ya está activada. Puedes iniciar sesión.
                </div>

                <form id="activate_form" class="space-y-4 hidden">
                    <div>
                        <label for="activate_password1" class="block text-sm font-medium text-gray-700 mb-1">Nueva Contraseña</label>
                        <input 
                            type="password" 
                            id="activate_password1" 
                            name="password1" 
                            required 
                            autocomplete="new-password"
                            minlength="8"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            placeholder="Mínimo 8 caracteres"
                        >
                    </div>
                    <div>
                        <label for="activate_password2" class="block text-sm font-medium text-gray-700 mb-1">Confirmar Contraseña</label>
                        <input 
                            type="password" 
                            id="activate_password2" 
                            name="password2" 
                            required 
                            autocomplete="new-password"
                            minlength="8"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            placeholder="Repite la contraseña"
                        >
                    </div>
                    <div id="activate_error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm hidden" role="alert">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="activate_error_text"></span>
                    </div>
                    <button 
                        type="submit" 
                        id="activate_submit_btn"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 disabled:cursor-not-allowed text-white font-semibold py-3 px-8 rounded-lg transition-colors duration-200 shadow-lg"
                    >
                        <i class="fas fa-check mr-2"></i>
                        Activar Cuenta
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="/static/tenant/landing/login.html" id="login_link" class="text-indigo-600 hover:text-indigo-800 text-sm hidden">
                        <i class="fas fa-sign-in-alt mr-1"></i>
                        Ir a Iniciar Sesión
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            
            function getCookie(name) {
                const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
                return m ? m.pop() : '';
            }
            
            const qs = new URLSearchParams(location.search);
            const token = qs.get('token');
            
            const invalidTokenEl = document.getElementById('invalid_token');
            const invalidTokenText = document.getElementById('invalid_token_text');
            const alreadyActivatedEl = document.getElementById('already_activated');
            const activateForm = document.getElementById('activate_form');
            const submitBtn = document.getElementById('activate_submit_btn');
            const activateError = document.getElementById('activate_error');
            const activateErrorText = document.getElementById('activate_error_text');
            const loginLink = document.getElementById('login_link');
            
            // Validar token al cargar
            async function validateToken() {
                if (!token) {
                    if (invalidTokenEl) invalidTokenEl.classList.remove('hidden');
                    if (invalidTokenText) invalidTokenText.textContent = 'Token no proporcionado.';
                    return false;
                }
                
                try {
                    const response = await fetch(`/api/v1/core/landing/auth/activate/?token=${encodeURIComponent(token)}`, {
                        method: 'GET',
                        credentials: 'same-origin',
                    });
                    
                    const data = await response.json();
                    
                    if (response.status === 200) {
                        if (activateForm) activateForm.classList.remove('hidden');
                        return true;
                    } else if (response.status === 409) {
                        // Ya activada
                        if (alreadyActivatedEl) alreadyActivatedEl.classList.remove('hidden');
                        if (loginLink) loginLink.classList.remove('hidden');
                        return false;
                    } else {
                        if (invalidTokenEl) invalidTokenEl.classList.remove('hidden');
                        if (invalidTokenText) invalidTokenText.textContent = data.detail || 'Token inválido o expirado.';
                        return false;
                    }
                } catch (error) {
                    if (invalidTokenEl) invalidTokenEl.classList.remove('hidden');
                    if (invalidTokenText) invalidTokenText.textContent = 'Error al validar el token.';
                    return false;
                }
            }
            
            // Activar cuenta
            activateForm?.addEventListener('submit', async (ev) => {
                ev.preventDefault();
                if (activateError) activateError.classList.add('hidden');
                
                const password1 = document.getElementById('activate_password1').value;
                const password2 = document.getElementById('activate_password2').value;
                
                if (password1.length < 8) {
                    if (activateErrorText) activateErrorText.textContent = 'La contraseña debe tener al menos 8 caracteres.';
                    if (activateError) activateError.classList.remove('hidden');
                    return;
                }
                
                if (password1 !== password2) {
                    if (activateErrorText) activateErrorText.textContent = 'Las contraseñas no coinciden.';
                    if (activateError) activateError.classList.remove('hidden');
                    return;
                }
                
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Activando...';
                }
                
                try {
                    const csrftoken = getCookie('csrftoken') || '';
                    const response = await fetch(`/api/v1/core/landing/auth/activate/?token=${encodeURIComponent(token)}`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrftoken,
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({
                            password1: password1,
                            password2: password2
                        })
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok) {
                        // Redirigir según redirect_url de la API
                        const redirectUrl = data.redirect_url || '/static/tenant/landing/login.html';
                        window.location.href = redirectUrl;
                    } else {
                        if (activateErrorText) activateErrorText.textContent = data.detail || 'Error al activar la cuenta.';
                        if (activateError) activateError.classList.remove('hidden');
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = '<i class="fas fa-check mr-2"></i>Activar Cuenta';
                        }
                    }
                } catch (error) {
                    if (activateErrorText) activateErrorText.textContent = 'Error de red. Intenta nuevamente.';
                    if (activateError) activateError.classList.remove('hidden');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-check mr-2"></i>Activar Cuenta';
                    }
                }
            });
            
            // Validar token al cargar
            validateToken();
        })();
    </script>
</body>
</html>
