{% load static %}
<div data-partial="perfil-card" class="perfil-card">
    <div class="card-header">
        <h3>Mi Perfil</h3>
    </div>
    <div class="card-body">
        <div id="perfil-loading" class="loading">Cargando perfil...</div>
        <div id="perfil-content" style="display: none;">
            <div class="perfil-info">
                <div id="perfil-cargo" class="perfil-field">
                    <strong>Cargo:</strong> <span id="perfil-cargo-value">-</span>
                </div>
                <div id="perfil-departamento" class="perfil-field">
                    <strong>Departamento:</strong> <span id="perfil-departamento-value">-</span>
                </div>
                <div id="perfil-telefono" class="perfil-field">
                    <strong>Teléfono Corporativo:</strong> <span id="perfil-telefono-value">-</span>
                </div>
            </div>
            <div class="perfil-actions">
                <a href="/perfil/" class="btn btn-primary">Editar Perfil</a>
            </div>
        </div>
        <div id="perfil-error" class="error-message" style="display: none;"></div>
    </div>
</div>
