{% load static %}
{# list.html estandarizado para módulo contabilidad asientos v2.37 #}
{# DataTables server-side POST obligatorio según arquitectura #}
<div id="ui-contabilidad-asientos-list" class="ui-module ui-contabilidad">
  <!-- Toolbar -->
  <div class="d-flex align-items-center gap-2 mb-3" id="toolbar-contabilidad-asientos">
    <input id="txt-buscar-contabilidad-asientos" class="form-control form-control-sm"
           type="search" placeholder="Buscar..." />
    <button id="btn-buscar-contabilidad-asientos" class="btn btn-sm btn-primary">Buscar</button>
    <button id="btn-refrescar-contabilidad-asientos" class="btn btn-sm btn-outline-secondary">Refrescar</button>
    <div id="actions-contabilidad-asientos" class="ms-auto">
      <button class="btn btn-sm btn-primary" id="btn-crear-asiento" type="button">
        <i class="bi bi-plus-circle"></i> Crear Asiento
      </button>
    </div>
  </div>
  
  <!-- Feedback -->
  <div id="feedback-contabilidad-asientos-list" class="alert d-none" role="alert"
       aria-live="polite"></div>
  
  <!-- Tabla DataTables -->
  <table id="table-contabilidad-asientos" class="table table-striped table-hover w-100" style="width:100%">
    <thead>
      <tr>
        <th>ID</th>
        <th>Número</th>
        <th>Fecha</th>
        <th>Descripción</th>
        <th>Estado</th>
        <th class="text-end">Débito</th>
        <th class="text-end">Crédito</th>
        <!-- Columna acciones (OBLIGATORIA) -->
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
