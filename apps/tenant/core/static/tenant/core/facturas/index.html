<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Facturas</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-gray-50">
  <main class="container mx-auto py-6" data-core-app="facturas">
    <h2 class="mb-3">Facturas</h2>
    
    <!-- Filtros -->
    <div id="facturas-filters" class="mb-3"></div>
    
    <!-- Tabla -->
    <div class="table-responsive">
      <table id="tbl-facturas" class="table table-sm align-middle">
        <thead>
          <tr>
            <th>Número</th>
            <th>Naturaleza</th>
            <th>Emisor</th>
            <th>Receptor</th>
            <th>Emisión</th>
            <th class="text-end">Subtotal</th>
            <th class="text-end">Impuestos</th>
            <th class="text-end">Total</th>
            <th>CUFE</th>
            <th>Acciones</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </main>

  <!-- Per-app JS (served by Core) -->
  <script type="module" src="/static/core/js/facturas.ui.js"></script>
</body>
</html>
