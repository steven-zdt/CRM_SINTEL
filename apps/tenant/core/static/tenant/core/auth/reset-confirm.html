<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Restablecer Contrasena</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .code-input { letter-spacing: 0.35em; text-transform: uppercase; font-family: 'Courier New', monospace; font-size: 1.4rem; text-align: center; }
    </style>
</head>
<body class="bg-gradient-to-br from-red-50 to-rose-100 min-h-screen">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="max-w-md w-full">
            <div class="bg-white rounded-lg shadow-xl p-8">

                <div class="text-center mb-6">
                    <div class="inline-block bg-red-600 text-white rounded-full p-4 mb-4">
                        <i class="fas fa-key text-4xl"></i>
                    </div>
                    <h1 class="text-2xl font-bold text-gray-800 mb-1">Nueva Contrasena</h1>
                    <p class="text-gray-500 text-sm">Ingresa el codigo recibido por email y tu nueva contrasena</p>
                </div>

                <form id="reset_confirm_form" class="space-y-4">

                    <div>
                        <label for="reset_code" class="block text-sm font-semibold text-gray-700 mb-1">
                            <i class="fas fa-hashtag mr-1 text-red-600"></i>Codigo de Restablecimiento
                        </label>
                        <input
                            type="text"
                            id="reset_code"
                            name="code"
                            required
                            maxlength="8"
                            autocomplete="one-time-code"
                            spellcheck="false"
                            class="code-input w-full px-4 py-3 border-2 border-gray-200 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                            placeholder="XXXXXXXX"
                        >
                        <p class="text-xs text-gray-400 mt-1">8 caracteres — revisa tu bandeja de entrada (y spam)</p>
                    </div>

                    <div>
                        <label for="reset_password1" class="block text-sm font-semibold text-gray-700 mb-1">
                            <i class="fas fa-lock mr-1 text-red-600"></i>Nueva Contrasena
                        </label>
                        <div class="relative">
                            <input
                                type="password"
                                id="reset_password1"
                                name="new_password"
                                required
                                autocomplete="new-password"
                                minlength="8"
                                class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent pr-10"
                                placeholder="Minimo 8 caracteres"
                            >
                            <button type="button" id="togglePass1"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600">
                                <i class="fas fa-eye"></i>
                            </button>
                        </div>
                    </div>

                    <div>
                        <label for="reset_password2" class="block text-sm font-semibold text-gray-700 mb-1">
                            <i class="fas fa-lock mr-1 text-red-600"></i>Confirmar Contrasena
                        </label>
                        <input
                            type="password"
                            id="reset_password2"
                            name="confirm_password"
                            required
                            autocomplete="new-password"
                            minlength="8"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-red-500 focus:border-transparent"
                            placeholder="Repite la contrasena"
                        >
                    </div>

                    <div id="reset_error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm hidden" role="alert">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="reset_error_text"></span>
                    </div>

                    <div id="reset_success" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg text-sm hidden" role="alert">
                        <i class="fas fa-check-circle mr-2"></i>
                        <span id="reset_success_text"></span>
                    </div>

                    <button
                        type="submit"
                        id="reset_submit_btn"
                        class="w-full bg-red-600 hover:bg-red-700 disabled:bg-red-300 disabled:cursor-not-allowed text-white font-semibold py-3 px-8 rounded-lg transition-colors duration-200 shadow-lg"
                    >
                        <i class="fas fa-save mr-2"></i>Guardar nueva contrasena
                    </button>
                </form>

                <div class="text-center mt-4 space-y-2">
                    <a href="/static/tenant/core/auth/reset-request.html"
                       class="text-red-600 hover:text-red-800 text-sm block">
                        <i class="fas fa-redo mr-1"></i>Solicitar nuevo codigo
                    </a>
                    <a href="/static/tenant/core/auth/login.html"
                       class="text-gray-500 hover:text-gray-700 text-sm block">
                        <i class="fas fa-arrow-left mr-1"></i>Volver al inicio de sesion
                    </a>
                </div>

            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        function getCookie(name) {
            const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
            return m ? m.pop() : '';
        }

        // [ARQ-A3] Detecta si estamos en el dominio publico (sintel.net.co, localhost, IP)
        // o en un subdominio de tenant (ADR-002 Regla 3, igual que activate.html).
        const IS_PUBLIC_DOMAIN = (function () {
            const host = window.location.hostname;
            return (
                host === 'sintel.net.co' ||
                host === 'localhost' ||
                /^\d+\.\d+\.\d+\.\d+$/.test(host)
            );
        })();

        function getApiUrl(action) {
            if (IS_PUBLIC_DOMAIN) {
                return '/api/public/v1/auth/' + action + '/';
            }
            return '/api/v1/core/auth/' + action + '/';
        }

        const codeInput    = document.getElementById('reset_code');
        const pass1        = document.getElementById('reset_password1');
        const pass2        = document.getElementById('reset_password2');
        const form         = document.getElementById('reset_confirm_form');
        const submitBtn    = document.getElementById('reset_submit_btn');
        const errorEl      = document.getElementById('reset_error');
        const errorText    = document.getElementById('reset_error_text');
        const successEl    = document.getElementById('reset_success');
        const successText  = document.getElementById('reset_success_text');

        // Normalizar codigo a mayusculas y filtrar caracteres validos
        codeInput.addEventListener('input', function () {
            this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
        });

        // Toggle visibilidad contrasena
        document.getElementById('togglePass1').addEventListener('click', function () {
            const type = pass1.type === 'password' ? 'text' : 'password';
            pass1.type = type;
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        function showError(msg) {
            errorText.textContent = msg;
            errorEl.classList.remove('hidden');
            successEl.classList.add('hidden');
        }
        function showSuccess(msg) {
            successText.textContent = msg;
            successEl.classList.remove('hidden');
            errorEl.classList.add('hidden');
        }

        form.addEventListener('submit', async function (ev) {
            ev.preventDefault();
            errorEl.classList.add('hidden');
            successEl.classList.add('hidden');

            const code     = codeInput.value.trim();
            const password = pass1.value;
            const confirm  = pass2.value;

            if (!code || code.length !== 8) {
                showError('Ingresa el codigo de 8 caracteres de tu correo.');
                return;
            }
            if (password.length < 8) {
                showError('La contrasena debe tener al menos 8 caracteres.');
                return;
            }
            if (password !== confirm) {
                showError('Las contrasenas no coinciden.');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Guardando...';

            try {
                const csrf = getCookie('csrftoken') || '';
                const resp = await fetch(getApiUrl('password-reset/confirm'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrf,
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ code, new_password: password, confirm_password: confirm }),
                });

                let data = {};
                try { data = await resp.json(); } catch (_) {}

                if (resp.ok) {
                    showSuccess(data.detail || 'Contrasena restablecida. Redirigiendo al login...');
                    form.classList.add('hidden');
                    setTimeout(() => {
                        window.location.href = data.redirect_url || '/static/tenant/core/auth/login.html';
                    }, 2500);
                } else {
                    showError(data.detail || 'Codigo invalido o expirado. Solicita uno nuevo.');
                }
            } catch (err) {
                showError('Error de red. Intenta nuevamente.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-save mr-2"></i>Guardar nueva contrasena';
            }
        });
    })();
    </script>
</body>
</html>
