<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Activar Cuenta | SINTEL</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .code-input {
            letter-spacing: 0.35em;
            text-transform: uppercase;
            font-family: 'Courier New', monospace;
            font-size: 1.35rem;
            text-align: center;
        }
        .btn-primary {
            background: linear-gradient(135deg, #4f46e5 0%, #7c3aed 100%);
            transition: all 0.3s ease;
        }
        .btn-primary:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 20px -5px rgba(79,70,229,0.4); }
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body class="bg-gradient-to-br from-slate-900 to-indigo-950 min-h-screen flex items-center justify-center px-4 py-8">

    <div class="max-w-md w-full">

        <!-- Logo -->
        <div class="text-center mb-8">
            <h1 class="text-3xl font-extrabold text-white tracking-tight">SINTEL <span class="text-indigo-400">Activacion</span></h1>
            <p class="text-slate-400 mt-1 text-sm">Ingresa el codigo recibido en tu correo</p>
        </div>

        <!-- Card -->
        <div class="bg-white/90 backdrop-blur rounded-3xl shadow-2xl p-8">

            <!-- Success State -->
            <div id="success_state" class="hidden text-center py-4">
                <div class="w-16 h-16 bg-green-100 text-green-600 rounded-full flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-check text-2xl"></i>
                </div>
                <h2 class="text-2xl font-bold text-gray-800 mb-2">Cuenta activada</h2>
                <p id="success_msg" class="text-gray-600 mb-6">Tu cuenta ha sido activada correctamente.</p>
                <a href="/static/tenant/core/auth/login.html"
                   class="btn-primary w-full block text-center text-white font-bold py-4 rounded-xl">
                    <i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesion
                </a>
            </div>

            <!-- Activation Form -->
            <form id="activation_form" class="space-y-5" novalidate>

                <div class="text-center mb-6">
                    <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto mb-3">
                        <i class="fas fa-key text-2xl"></i>
                    </div>
                    <h2 class="text-2xl font-bold text-gray-900">Activa tu cuenta</h2>
                    <p class="text-gray-500 text-sm mt-1">Usa el codigo de 8 caracteres enviado a tu email</p>
                </div>

                <!-- Email -->
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">
                        <i class="fas fa-envelope mr-1 text-indigo-500"></i>Tu email
                    </label>
                    <input type="email" id="input_email" required
                           class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                           placeholder="tu@email.com">
                </div>

                <!-- Codigo -->
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">
                        <i class="fas fa-hashtag mr-1 text-indigo-500"></i>Codigo de activacion (8 caracteres)
                    </label>
                    <input type="text" id="input_code" required
                           maxlength="8" autocomplete="one-time-code" spellcheck="false"
                           class="code-input w-full border-2 border-indigo-200 rounded-xl px-4 py-3 focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                           placeholder="XXXXXXXX">
                    <p class="text-xs text-gray-400 mt-1">Revisa tu bandeja de entrada (y spam)</p>
                </div>

                <!-- Contrasena -->
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">
                        <i class="fas fa-lock mr-1 text-indigo-500"></i>Nueva contrasena
                    </label>
                    <div class="relative">
                        <input type="password" id="input_password" required minlength="8"
                               class="w-full border border-gray-200 rounded-xl px-4 py-3 pr-10 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                               placeholder="Minimo 8 caracteres">
                        <button type="button" id="toggle_pass"
                                class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400 hover:text-indigo-600">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <!-- Confirmar -->
                <div>
                    <label class="block text-sm font-semibold text-gray-600 mb-1">
                        <i class="fas fa-lock mr-1 text-indigo-500"></i>Confirmar contrasena
                    </label>
                    <input type="password" id="input_confirm" required minlength="8"
                           class="w-full border border-gray-200 rounded-xl px-4 py-3 text-sm focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none transition"
                           placeholder="Repite la contrasena">
                </div>

                <!-- Error -->
                <div id="error_box" class="hidden bg-red-50 border border-red-200 text-red-700 rounded-xl px-4 py-3 text-sm flex items-center gap-2">
                    <i class="fas fa-exclamation-circle flex-shrink-0"></i>
                    <span id="error_text"></span>
                </div>

                <!-- Submit -->
                <button type="submit" id="submit_btn"
                        class="btn-primary w-full text-white font-bold py-4 rounded-xl text-sm">
                    <i class="fas fa-unlock-alt mr-2"></i>Activar cuenta
                </button>

            </form>

            <div class="text-center mt-5 space-y-1">
                <a href="/static/tenant/core/auth/login.html"
                   class="text-sm text-gray-400 hover:text-indigo-600 block transition">
                    <i class="fas fa-arrow-left mr-1"></i>Volver al login
                </a>
            </div>
        </div>
    </div>

    <script>
    (function () {
        'use strict';

        function getCookie(name) {
            const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
            return m ? m.pop() : '';
        }

        const form = document.getElementById('activation_form');
        const codeInput = document.getElementById('input_code');
        const passInput = document.getElementById('input_password');
        const confirmInput = document.getElementById('input_confirm');
        const emailInput = document.getElementById('input_email');
        const submitBtn = document.getElementById('submit_btn');
        const errorBox = document.getElementById('error_box');
        const errorText = document.getElementById('error_text');
        const successState = document.getElementById('success_state');
        const successMsg = document.getElementById('success_msg');

        // Normalizar codigo a mayusculas
        codeInput.addEventListener('input', function () {
            this.value = this.value.toUpperCase().replace(/[^A-Z0-9]/g, '').slice(0, 8);
        });

        // Toggle password
        document.getElementById('toggle_pass').addEventListener('click', function () {
            const t = passInput.type === 'password' ? 'text' : 'password';
            passInput.type = t;
            confirmInput.type = t;
            this.querySelector('i').classList.toggle('fa-eye');
            this.querySelector('i').classList.toggle('fa-eye-slash');
        });

        function showError(msg) {
            errorText.textContent = msg;
            errorBox.classList.remove('hidden');
        }
        function hideError() { errorBox.classList.add('hidden'); }

        form.addEventListener('submit', async function (e) {
            e.preventDefault();
            hideError();

            const email = emailInput.value.trim();
            const code = codeInput.value.trim();
            const password = passInput.value;
            const confirm = confirmInput.value;

            if (!email) { showError('Ingresa tu email.'); return; }
            if (code.length !== 8) { showError('El codigo debe tener 8 caracteres.'); return; }
            if (password.length < 8) { showError('La contrasena debe tener al menos 8 caracteres.'); return; }
            if (password !== confirm) { showError('Las contrasenas no coinciden.'); return; }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Activando...';

            try {
                const resp = await fetch('/api/v1/core/auth/activate-with-code/', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': getCookie('csrftoken'),
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email, code, password, confirm_password: confirm }),
                });

                let data = {};
                try { data = await resp.json(); } catch (_) {}

                if (resp.ok) {
                    form.classList.add('hidden');
                    successMsg.textContent = data.detail || 'Cuenta activada correctamente.';
                    successState.classList.remove('hidden');
                    setTimeout(() => {
                        window.location.href = data.redirect_url || '/static/tenant/core/auth/login.html';
                    }, 2500);
                } else {
                    showError(data.detail || 'Codigo invalido o expirado. Solicita uno nuevo.');
                }
            } catch (err) {
                showError('Error de red. Intenta nuevamente.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-unlock-alt mr-2"></i>Activar cuenta';
            }
        });
    })();
    </script>
</body>
</html>
