<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="max-w-md w-full">
            <div class="bg-white rounded-lg shadow-xl p-8">
                <div class="text-center mb-6">
                    <div class="inline-block bg-indigo-600 text-white rounded-full p-4 mb-4">
                        <i class="fas fa-building text-4xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2" id="tenant_name">Sistema de Gestión</h1>
                    <p class="text-gray-600">Iniciar Sesión</p>
                </div>

                <form id="login_form" class="space-y-4">
                    <div>
                        <label for="login_email" class="block text-sm font-medium text-gray-700 mb-1">Email o Usuario</label>
                        <input 
                            type="text" 
                            id="login_email" 
                            name="email" 
                            required 
                            autocomplete="username"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            placeholder="tu@email.com"
                        >
                    </div>
                    <div>
                        <label for="login_password" class="block text-sm font-medium text-gray-700 mb-1">Contraseña</label>
                        <input 
                            type="password" 
                            id="login_password" 
                            name="password" 
                            required 
                            autocomplete="current-password"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            placeholder="••••••••"
                        >
                    </div>
                    <div id="login_error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm hidden" role="alert">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="login_error_text"></span>
                    </div>
                    <button 
                        type="submit" 
                        id="login_submit_btn"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 disabled:cursor-not-allowed text-white font-semibold py-3 px-8 rounded-lg transition-colors duration-200 shadow-lg"
                    >
                        <i class="fas fa-sign-in-alt mr-2"></i>
                        Iniciar Sesión
                    </button>
                </form>

                <div class="text-center mt-4 space-y-2">
                    <a href="/static/tenant/core/auth/reset-request.html" class="text-indigo-600 hover:text-indigo-800 text-sm block">
                        <i class="fas fa-key mr-1"></i>
                        ¿Olvidaste tu contraseña?
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';

            function getCookie(name) {
                const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
                return m ? m.pop() : '';
            }

            // [ARQ-A3] Detecta si estamos en el dominio publico (sintel.net.co, localhost, IP)
            // o en un subdominio de tenant (ADR-002 Regla 3, igual que activate.html).
            const IS_PUBLIC_DOMAIN = (function () {
                const host = window.location.hostname;
                return (
                    host === 'sintel.net.co' ||
                    host === 'localhost' ||
                    /^\d+\.\d+\.\d+\.\d+$/.test(host)
                );
            })();

            function getApiUrl(action) {
                if (IS_PUBLIC_DOMAIN) {
                    return '/api/public/v1/auth/' + action + '/';
                }
                return '/api/v1/core/auth/' + action + '/';
            }

            // Cargar información del tenant
            async function loadTenantInfo() {
                try {
                    const response = await fetch('/api/v1/core/landing/info/', {
                        method: 'GET',
                        credentials: 'same-origin',
                    });
                    if (response.ok) {
                        const data = await response.json();
                        const tenantNameEl = document.getElementById('tenant_name');
                        if (tenantNameEl && data.nombre) {
                            tenantNameEl.textContent = data.nombre;
                        }
                        if (document.title) {
                            document.title = `${data.nombre || 'Sistema'} - Iniciar Sesión`;
                        }
                    }
                } catch (e) {
                    console.warn('No se pudo cargar información del tenant:', e);
                }
            }
            
            // Login function
            async function login(email, password) {
                const csrftoken = getCookie('csrftoken') || '';
                const response = await fetch(getApiUrl('login'), {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-CSRFToken': csrftoken,
                    },
                    credentials: 'same-origin',
                    body: JSON.stringify({ email, password })
                });
                
                // ⚠️ v2.61: Manejar respuestas no-JSON (404 HTML, errores del servidor)
                let data = {};
                try {
                    // Verificar Content-Type antes de parsear
                    const contentType = response.headers.get('content-type');
                    if (contentType && contentType.includes('application/json')) {
                        data = await response.json();
                    } else {
                        // Si no es JSON, leer como texto para debugging
                        const text = await response.text();
                        console.error('[Login] Respuesta no-JSON recibida:', {
                            status: response.status,
                            statusText: response.statusText,
                            contentType: contentType,
                            preview: text.substring(0, 200)
                        });
                        
                        // Si es 404, el endpoint no existe
                        if (response.status === 404) {
                            data = { detail: 'El endpoint de autenticación no está disponible. Por favor, contacte al administrador.' };
                        } else {
                            data = { detail: 'Error al procesar la respuesta del servidor.' };
                        }
                    }
                } catch (e) {
                    console.error('[Login] Error parseando respuesta:', e);
                    data = { detail: 'Error al procesar la respuesta del servidor.' };
                }
                
                if (response.ok && data.redirect_url) {
                    window.location.href = data.redirect_url;
                } else {
                    const errorEl = document.getElementById('login_error');
                    const errorTextEl = document.getElementById('login_error_text');
                    if (errorEl && errorTextEl) {
                        errorTextEl.textContent = data.detail || 'No fue posible iniciar sesión.';
                        errorEl.classList.remove('hidden');
                    }
                }
                
                return { ok: response.ok, data };
            }
            
            // Wire form
            const loginForm = document.getElementById('login_form');
            const submitBtn = document.getElementById('login_submit_btn');
            const loginError = document.getElementById('login_error');
            const loginErrorText = document.getElementById('login_error_text');
            
            loginForm?.addEventListener('submit', async (ev) => {
                ev.preventDefault();
                if (loginError) loginError.classList.add('hidden');
                if (loginErrorText) loginErrorText.textContent = '';
                
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Iniciando sesión...';
                }
                
                const email = document.getElementById('login_email').value.trim();
                const password = document.getElementById('login_password').value;
                
                if (!email || !password) {
                    if (loginErrorText) loginErrorText.textContent = 'Email y contraseña son requeridos.';
                    if (loginError) loginError.classList.remove('hidden');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión';
                    }
                    return;
                }
                
                try {
                    const result = await login(email, password);
                    if (!result.ok) {
                        if (submitBtn) {
                            submitBtn.disabled = false;
                            submitBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión';
                        }
                    }
                } catch (error) {
                    if (loginErrorText) loginErrorText.textContent = error.message || 'Error de red. Intenta nuevamente.';
                    if (loginError) loginError.classList.remove('hidden');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-sign-in-alt mr-2"></i>Iniciar Sesión';
                    }
                }
            });
            
            // Load tenant info on page load
            loadTenantInfo();
        })();
    </script>
</body>
</html>
