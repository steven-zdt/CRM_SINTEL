<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Solicitar Restablecimiento de Contraseña</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="min-h-screen flex items-center justify-center px-4 py-8">
        <div class="max-w-md w-full">
            <div class="bg-white rounded-lg shadow-xl p-8">
                <div class="text-center mb-6">
                    <div class="inline-block bg-indigo-600 text-white rounded-full p-4 mb-4">
                        <i class="fas fa-key text-4xl"></i>
                    </div>
                    <h1 class="text-3xl font-bold text-gray-800 mb-2">Restablecer Contraseña</h1>
                    <p class="text-gray-600">Ingresa tu email para recibir instrucciones</p>
                </div>

                <form id="reset_request_form" class="space-y-4">
                    <div>
                        <label for="reset_email" class="block text-sm font-medium text-gray-700 mb-1">Email</label>
                        <input 
                            type="email" 
                            id="reset_email" 
                            name="email" 
                            required 
                            autocomplete="email"
                            class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent"
                            placeholder="tu@email.com"
                        >
                    </div>
                    <div id="reset_error" class="bg-red-50 border border-red-200 text-red-700 px-4 py-3 rounded-lg text-sm hidden" role="alert">
                        <i class="fas fa-exclamation-circle mr-2"></i>
                        <span id="reset_error_text"></span>
                    </div>
                    <div id="reset_success" class="bg-green-50 border border-green-200 text-green-700 px-4 py-3 rounded-lg text-sm hidden" role="alert">
                        <i class="fas fa-check-circle mr-2"></i>
                        <span id="reset_success_text"></span>
                    </div>
                    <button 
                        type="submit" 
                        id="reset_submit_btn"
                        class="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-indigo-400 disabled:cursor-not-allowed text-white font-semibold py-3 px-8 rounded-lg transition-colors duration-200 shadow-lg"
                    >
                        <i class="fas fa-paper-plane mr-2"></i>
                        Enviar Instrucciones
                    </button>
                </form>

                <div class="text-center mt-4">
                    <a href="/static/tenant/core/auth/login.html" class="text-indigo-600 hover:text-indigo-800 text-sm">
                        <i class="fas fa-arrow-left mr-1"></i>
                        Volver al inicio de sesión
                    </a>
                </div>
            </div>
        </div>
    </div>

    <script>
        (function() {
            'use strict';
            
            function getCookie(name) {
                const m = document.cookie.match('(^|;)\\s*' + name + '\\s*=\\s*([^;]+)');
                return m ? m.pop() : '';
            }

            // [ARQ-A3] Detecta si estamos en el dominio publico (sintel.net.co, localhost, IP)
            // o en un subdominio de tenant (ADR-002 Regla 3, igual que activate.html).
            const IS_PUBLIC_DOMAIN = (function () {
                const host = window.location.hostname;
                return (
                    host === 'sintel.net.co' ||
                    host === 'localhost' ||
                    /^\d+\.\d+\.\d+\.\d+$/.test(host)
                );
            })();

            function getApiUrl(action) {
                if (IS_PUBLIC_DOMAIN) {
                    return '/api/public/v1/auth/' + action + '/';
                }
                return '/api/v1/core/auth/' + action + '/';
            }

            const resetForm = document.getElementById('reset_request_form');
            const submitBtn = document.getElementById('reset_submit_btn');
            const resetError = document.getElementById('reset_error');
            const resetErrorText = document.getElementById('reset_error_text');
            const resetSuccess = document.getElementById('reset_success');
            const resetSuccessText = document.getElementById('reset_success_text');
            
            resetForm?.addEventListener('submit', async (ev) => {
                ev.preventDefault();
                if (resetError) resetError.classList.add('hidden');
                if (resetSuccess) resetSuccess.classList.add('hidden');
                
                if (submitBtn) {
                    submitBtn.disabled = true;
                    submitBtn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i>Enviando...';
                }
                
                const email = document.getElementById('reset_email').value.trim();
                
                if (!email) {
                    if (resetErrorText) resetErrorText.textContent = 'Email es requerido.';
                    if (resetError) resetError.classList.remove('hidden');
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Enviar Instrucciones';
                    }
                    return;
                }
                
                try {
                    const csrftoken = getCookie('csrftoken') || '';
                    const url = getApiUrl('password-reset/request');
                    
                    console.log('[reset-request] Enviando solicitud a:', url);
                    console.log('[reset-request] Email:', email);
                    console.log('[reset-request] CSRF Token:', csrftoken ? 'Presente' : 'Ausente');
                    
                    const response = await fetch(url, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrftoken,
                        },
                        credentials: 'same-origin',
                        body: JSON.stringify({ email })
                    });
                    
                    console.log('[reset-request] Respuesta recibida:', {
                        status: response.status,
                        statusText: response.statusText,
                        ok: response.ok,
                        contentType: response.headers.get('content-type')
                    });
                    
                    // ⚠️ CRÍTICO: Verificar que la respuesta sea JSON antes de parsear
                    const contentType = response.headers.get('content-type');
                    let data = null;
                    
                    if (contentType && contentType.includes('application/json')) {
                        try {
                            data = await response.json();
                            console.log('[reset-request] JSON parseado:', data);
                        } catch (jsonError) {
                            console.error('[reset-request] Error al parsear JSON:', jsonError);
                            const text = await response.text();
                            console.error('[reset-request] Respuesta del servidor:', text.substring(0, 200));
                            if (resetErrorText) resetErrorText.textContent = `Error del servidor (${response.status}): Respuesta no válida`;
                            if (resetError) resetError.classList.remove('hidden');
                            return;
                        }
                    } else {
                        // El servidor devolvió HTML (probablemente una página de error)
                        const text = await response.text();
                        console.error('[reset-request] El servidor devolvió HTML en lugar de JSON:', text.substring(0, 500));
                        
                        let errorMsg = `Error del servidor (${response.status})`;
                        if (response.status === 404) {
                            errorMsg = 'Endpoint no encontrado. Verifique que el servidor esté configurado correctamente.';
                        } else if (response.status === 500) {
                            errorMsg = 'Error interno del servidor. Revise los logs del servidor.';
                        } else if (response.status === 403) {
                            errorMsg = 'No tiene permisos para realizar esta acción.';
                        } else if (response.status === 401) {
                            errorMsg = 'Sesión expirada. Por favor, recargue la página.';
                        }
                        
                        if (resetErrorText) resetErrorText.textContent = errorMsg;
                        if (resetError) resetError.classList.remove('hidden');
                        return;
                    }
                    
                    if (response.ok) {
                        if (resetSuccessText) resetSuccessText.textContent = data.detail || 'Si el email existe, recibirás instrucciones.';
                        if (resetSuccess) resetSuccess.classList.remove('hidden');
                        resetForm.reset();
                    } else {
                        if (resetErrorText) resetErrorText.textContent = data.detail || 'Error al enviar la solicitud.';
                        if (resetError) resetError.classList.remove('hidden');
                    }
                } catch (error) {
                    console.error('[reset-request] Error en petición:', error);
                    if (resetErrorText) resetErrorText.textContent = `Error de red: ${error.message || 'Intenta nuevamente.'}`;
                    if (resetError) resetError.classList.remove('hidden');
                } finally {
                    if (submitBtn) {
                        submitBtn.disabled = false;
                        submitBtn.innerHTML = '<i class="fas fa-paper-plane mr-2"></i>Enviar Instrucciones';
                    }
                }
            });
        })();
    </script>
</body>
</html>
