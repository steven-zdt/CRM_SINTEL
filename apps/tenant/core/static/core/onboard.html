<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Onboarding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 min-h-screen">
  <div class="min-h-screen flex items-center justify-center">
    <div class="max-w-lg w-full p-6">
      <div class="bg-white rounded-lg shadow p-6 text-center">
        <div class="mb-4">
          <i class="fas fa-key text-4xl text-indigo-600"></i>
        </div>
        <h1 class="text-2xl font-bold mb-2">Preparando su espacio</h1>
        <p class="text-gray-600 mb-4">Espere mientras validamos el enlace seguro...</p>
        <div id="status" class="text-sm text-gray-700">Validando token...</div>
      </div>
    </div>
  </div>

  <script>
    (function(){
      'use strict';
      const qs = new URLSearchParams(location.search);
      const ott = qs.get('ott');
      const statusEl = document.getElementById('status');

      if (!ott) {
        statusEl.textContent = 'OTT no proporcionado en la URL.';
        return;
      }

      async function consume() {
        try {
          const resp = await fetch('/api/v1/core/auth/consume-ott/', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
            credentials: 'include',
            body: JSON.stringify({ ott: ott })
          });

          const data = await resp.json().catch(() => ({}));

          if (!resp.ok) {
            statusEl.textContent = data.detail || 'Token invalido o expirado.';
            return;
          }

          if (data.already_activated) {
            // Cuenta existente: el tenant fue vinculado, redirigir al login con mensaje
            statusEl.innerHTML =
              '<div style="color:#1971c2;font-size:.95rem;line-height:1.5;">' +
              '<strong>Acceso listo.</strong><br>' +
              (data.message || 'El tenant fue anadido a tu cuenta existente.') +
              '</div>';
            setTimeout(function () {
              window.location.href = data.redirect_url || '/login/';
            }, 3000);
            return;
          }

          // Cuenta nueva: sesion establecida, ir al workspace
          window.location.href = '/workspace/';

        } catch (err) {
          statusEl.textContent = 'Error de red al consumir el token.';
        }
      }

      consume();
    })();
  </script>
</body>
</html>
