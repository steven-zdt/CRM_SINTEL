{% load static %}
{% load tenant_branding %}
<!-- ⚠️ v2.40: Header alineado con Bootstrap 5 (Tailwind removido) -->
<header class="bg-dark shadow-sm">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <div class="d-flex align-items-center">
                {% tenant_branding_header %}
            </div>
            {% if user.is_authenticated %}
            <div class="d-flex align-items-center">
                <!-- Dropdown de cuenta (Bootstrap 5) -->
                <div class="dropdown" id="account-dropdown-container">
                    <button id="account-dropdown-toggle" 
                            type="button"
                            class="btn btn-link text-white text-decoration-none dropdown-toggle d-flex align-items-center gap-2"
                            data-bs-toggle="dropdown"
                            aria-expanded="false"
                            aria-label="Menú de cuenta">
                        <span class="small">{{ user.get_full_name|default:user.email|truncatewords:1 }}</span>
                        <i class="fas fa-chevron-down small"></i>
                    </button>
                    <!-- Dropdown menu -->
                    <ul id="account-dropdown-menu" 
                        class="dropdown-menu dropdown-menu-end shadow"
                        role="menu" 
                        aria-orientation="vertical">
                        <li>
                            <a href="#perfil" 
                               id="account-menu-perfil"
                               class="dropdown-item"
                               role="menuitem">
                                <i class="fas fa-user me-2"></i>Perfil
                            </a>
                        </li>
                        <li><hr class="dropdown-divider"></li>
                        <li>
                            <button id="account-menu-logout"
                                    type="button"
                                    class="dropdown-item"
                                    role="menuitem"
                                    aria-label="Cerrar sesión">
                                <i class="fas fa-sign-out-alt me-2"></i>Cerrar Sesión
                            </button>
                        </li>
                    </ul>
                </div>
            </div>
            {% else %}
            <div class="d-flex align-items-center">
                <a href="/login/" 
                   class="btn btn-primary">
                    <i class="fas fa-sign-in-alt me-2"></i>Iniciar Sesión
                </a>
            </div>
            {% endif %}
        </div>
    </nav>
</header>
