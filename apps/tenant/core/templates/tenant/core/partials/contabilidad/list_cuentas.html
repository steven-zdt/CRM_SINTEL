{% load static %}
{# list.html estandarizado para módulo contabilidad cuentas v2.37 #}
{# DataTables server-side POST obligatorio según arquitectura #}
<div id="ui-contabilidad-cuentas-list" class="ui-module ui-contabilidad">
  <!-- Toolbar -->
  <div class="d-flex align-items-center gap-2 mb-3" id="toolbar-contabilidad-cuentas">
    <input id="txt-buscar-contabilidad-cuentas" class="form-control form-control-sm"
           type="search" placeholder="Buscar..." />
    <button id="btn-buscar-contabilidad-cuentas" class="btn btn-sm btn-primary">Buscar</button>
    <button id="btn-refrescar-contabilidad-cuentas" class="btn btn-sm btn-outline-secondary">Refrescar</button>
    <div id="actions-contabilidad-cuentas" class="ms-auto">
      <button class="btn btn-sm btn-primary" id="btn-crear-cuenta" type="button">
        <i class="bi bi-plus-circle"></i> Crear Cuenta
      </button>
    </div>
  </div>
  
  <!-- Feedback -->
  <div id="feedback-contabilidad-cuentas-list" class="alert d-none" role="alert"
       aria-live="polite"></div>
  
  <!-- Tabla DataTables -->
  <!-- ⚠️ v2.40: ID oculto (ya existía pero ahora oculto) -->
  <table id="table-contabilidad-cuentas" class="table table-striped table-hover w-100" style="width:100%">
    <thead>
      <tr>
        <th style="display: none;">ID</th> <!-- Columna 0: ID oculto (requerido para rowId) -->
        <th>Código</th>
        <th>Nombre</th>
        <th>Tipo</th>
        <th>Estado</th>
        <!-- Columna acciones (OBLIGATORIA) -->
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
