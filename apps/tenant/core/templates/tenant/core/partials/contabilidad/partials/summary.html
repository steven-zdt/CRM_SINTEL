{% load static %}
<div data-partial="contabilidad-summary" class="contabilidad-summary">
    <div class="summary-header">
        <h3>Resumen Contable</h3>
        <a href="/contabilidad/" class="btn btn-sm btn-primary">Ver Detalle</a>
    </div>
    <div class="summary-body">
        <div id="contabilidad-loading" class="loading">Cargando resumen...</div>
        <div id="contabilidad-content" style="display: none;">
            <div class="summary-stats">
                <div class="stat-item">
                    <div class="stat-label">Total Activos</div>
                    <div id="contabilidad-activos" class="stat-value">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Total Pasivos</div>
                    <div id="contabilidad-pasivos" class="stat-value">-</div>
                </div>
                <div class="stat-item">
                    <div class="stat-label">Total Patrimonio</div>
                    <div id="contabilidad-patrimonio" class="stat-value">-</div>
                </div>
            </div>
        </div>
        <div id="contabilidad-error" class="error-message" style="display: none;"></div>
    </div>
</div>
