{% load static %}
{# modals.html - Modales del módulo Clientes v2.40 #}
{# ⚠️ API-First: Sin datos server-side, solo estructura HTML #}
{# ⚠️ v2.40: Alineado con el modelo Cliente actual #}

<!-- Modal: Crear/Editar Cliente -->
<div class="modal fade" id="modal-cliente" tabindex="-1" aria-labelledby="modal-cliente-label" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-cliente-label">Cliente</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        {# ⚠️ v2.60: Contenedor de errores para Error Boundary Pattern #}
        <div id="form-cliente-feedback" class="alert alert-danger d-none mb-3" role="alert"></div>
        <div id="cliente-feedback" class="alert d-none" role="alert" aria-live="polite"></div>
        <form id="form-cliente" method="POST" onsubmit="return false;">
          <input type="hidden" id="cliente-id" name="id">
          
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="cliente-tipo_persona" class="form-label">Tipo Persona *</label>
              <select class="form-select" id="cliente-tipo_persona" name="tipo_persona" required>
                <option value="">Seleccionar...</option>
                <option value="NATURAL">Persona natural</option>
                <option value="JURIDICA">Persona jurídica</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label for="cliente-tipo_documento" class="form-label">Tipo Documento *</label>
              <select class="form-select" id="cliente-tipo_documento" name="tipo_documento" required>
                <option value="">Seleccionar...</option>
                <option value="CC">Cédula de ciudadanía</option>
                <option value="CE">Cédula de extranjería</option>
                <option value="NIT">NIT</option>
                <option value="PA">Pasaporte</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label for="cliente-numero_documento" class="form-label">Número Documento *</label>
              <input type="text" class="form-control" id="cliente-numero_documento" name="numero_documento" required placeholder="Número de documento" />
            </div>
            <div class="col-md-6 mb-3">
              <label for="cliente-razon_social" class="form-label">Razón Social *</label>
              <input type="text" class="form-control" id="cliente-razon_social" name="razon_social" required placeholder="Razón social o nombre completo" />
            </div>
            <div class="col-md-6 mb-3">
              <label for="cliente-nombre_comercial" class="form-label">Nombre Comercial</label>
              <input type="text" class="form-control" id="cliente-nombre_comercial" name="nombre_comercial" placeholder="Nombre comercial" />
            </div>
            <div class="col-md-6 mb-3">
              <label for="cliente-regimen_tributario" class="form-label">Régimen Tributario *</label>
              <select class="form-select" id="cliente-regimen_tributario" name="regimen_tributario" required>
                <option value="">Seleccionar...</option>
                <option value="SIMPLE">Régimen Simple</option>
                <option value="ORDINARIO">Régimen Ordinario</option>
                <option value="NO_RESP">No responsable de IVA</option>
              </select>
            </div>
            <div class="col-md-6 mb-3">
              <label for="cliente-email" class="form-label">Email</label>
              <input type="email" class="form-control" id="cliente-email" name="email" placeholder="Email de contacto" />
            </div>
            <div class="col-md-6 mb-3">
              <label for="cliente-telefono" class="form-label">Teléfono</label>
              <input type="text" class="form-control" id="cliente-telefono" name="telefono" placeholder="Teléfono" />
            </div>
            <div class="col-md-12 mb-3">
              <label for="cliente-direccion" class="form-label">Dirección</label>
              <input type="text" class="form-control" id="cliente-direccion" name="direccion" placeholder="Dirección" />
            </div>
            <div class="col-md-6 mb-3">
              <label for="cliente-ciudad" class="form-label">Ciudad</label>
              <input type="text" class="form-control" id="cliente-ciudad" name="ciudad" placeholder="Ciudad" />
            </div>
            <div class="col-md-6 mb-3">
              <div class="form-check mt-4">
                <input class="form-check-input" type="checkbox" id="cliente-activo" name="activo" checked />
                <label class="form-check-label" for="cliente-activo">
                  Activo
                </label>
              </div>
            </div>
            <div class="col-md-12 mb-3">
              <label for="cliente-observaciones" class="form-label">Observaciones</label>
              <textarea class="form-control" id="cliente-observaciones" name="observaciones" rows="3" placeholder="Observaciones adicionales"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="submit" form="form-cliente" class="btn btn-primary" id="btn-guardar-cliente">Guardar</button>
      </div>
    </div>
  </div>
</div>
