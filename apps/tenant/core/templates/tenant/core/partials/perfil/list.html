{% load static %}
{# list.html estandarizado para módulo Perfil v2.40 - Tabulator Implementation #}
{# ⚠️ v2.40: Usa TabulatorFactory para tabla interactiva #}
<div id="ui-perfil-list" class="ui-module ui-perfil">
  <!-- Toolbar -->
  <div class="d-flex align-items-center gap-2 mb-3" id="toolbar-perfil">
    <!-- Búsqueda -->
    <div class="flex-grow-1">
      <div class="input-group">
        <span class="input-group-text"><i class="fas fa-search"></i></span>
        <input type="text" class="form-control" id="search-perfil" placeholder="Buscar por nombre, email, cargo, departamento...">
      </div>
    </div>
    <!-- Botones de acción -->
    <div id="actions-perfil" class="ms-auto">
      <button class="btn btn-sm btn-primary" id="btn-perfil-crear" type="button">
        <i class="bi bi-plus-circle"></i> Nuevo Perfil
      </button>
      <button class="btn btn-sm btn-secondary" id="btn-refrescar-perfil" type="button">
        <i class="bi bi-arrow-clockwise"></i> Refrescar
      </button>
    </div>
  </div>
  
  <!-- Feedback -->
  <div id="feedback-perfil-list" class="alert d-none" role="alert"
       aria-live="polite"></div>
  
  <!-- Tabla Tabulator -->
  <div id="grid-perfil" class="mt-3"></div>
</div>
