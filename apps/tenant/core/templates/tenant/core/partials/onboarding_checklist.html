<div id="onboarding-checklist" class="card border-0 shadow-sm mx-auto mb-4 d-none" style="max-width: 640px;">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <h5 class="mb-0 fw-bold"><i class="bi bi-rocket-takeoff me-2"></i>Primeros pasos</h5>
      <span id="onboarding-progress-label" class="badge bg-info-subtle text-info-emphasis"></span>
    </div>
    <div class="progress mb-3" style="height: 6px;">
      <div id="onboarding-progress-bar" class="progress-bar bg-info" role="progressbar" style="width: 0%;" aria-valuemin="0" aria-valuemax="100"></div>
    </div>
    <ul id="onboarding-steps" class="list-group list-group-flush"></ul>
  </div>
</div>
