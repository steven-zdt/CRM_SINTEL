<div class="modal fade" id="modal-categoria" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-primary text-white">
                <h5 class="modal-title">Gestión de Categoría</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="form-categoria">
                <div class="modal-body">
                    <input type="hidden" id="categoria-id" name="id">
                    
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-bold">Nombre de la Categoría *</label>
                            <input type="text" class="form-control" id="categoria-nombre" name="nombre" required maxlength="100">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold">Descripción</label>
                            <textarea class="form-control" id="categoria-descripcion" name="descripcion" rows="3" maxlength="500"></textarea>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Aplicación *</label>
                            <select class="form-select" id="categoria-aplicacion" name="aplicacion" required>
                                <option value="">Seleccione...</option>
                                <option value="TODO">Todos (Productos, Servicios y Activos)</option>
                                <option value="PRODUCTO">Solo Productos</option>
                                <option value="SERVICIO">Solo Servicios</option>
                                <option value="ACTIVO">Solo Activos Fijos</option>
                            </select>
                            <small class="form-text text-muted">Define para qué tipo de ítems se puede usar esta categoría.</small>
                        </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold">Estado</label>
                        <div class="form-check form-switch mt-2">
                            <input class="form-check-input" type="checkbox" id="categoria-activo" name="activo" checked>
                            <label class="form-check-label" for="categoria-activo">
                                <span class="badge bg-success" id="categoria-estado-badge">Activa</span>
                            </label>
                        </div>
                        <small class="form-text text-muted">Desactive para poder eliminar la categoría</small>
                    </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btn-guardar-categoria">Guardar Categoría</button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal para Ver Categoría (solo lectura) -->
<div class="modal fade" id="modal-categoria-view" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-info text-white">
                <h5 class="modal-title"><i class="bi bi-eye me-2"></i>Ver Categoría</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <div class="row g-3">
                    <div class="col-12">
                        <label class="form-label small fw-bold text-muted">Nombre de la Categoría</label>
                        <p class="form-control-plaintext fw-bold" id="categoria-view-nombre">-</p>
                    </div>

                    <div class="col-12">
                        <label class="form-label small fw-bold text-muted">Descripción</label>
                        <p class="form-control-plaintext" id="categoria-view-descripcion">-</p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">Aplicación</label>
                        <p class="form-control-plaintext" id="categoria-view-aplicacion">-</p>
                    </div>

                    <div class="col-md-6">
                        <label class="form-label small fw-bold text-muted">Estado</label>
                        <p class="form-control-plaintext">
                            <span id="categoria-view-activo" class="badge">-</span>
                        </p>
                    </div>
                    <div class="col-12">
                        <label class="form-label small fw-bold text-muted">Resumen de Ítems Asociados</label>
                        <div id="categoria-view-resumen" class="border rounded p-3 bg-light">
                            <p class="text-muted mb-0">Cargando resumen...</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="modal-footer bg-light">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>
