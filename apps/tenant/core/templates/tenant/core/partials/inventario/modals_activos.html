<div class="modal fade" id="modal-activo" tabindex="-1" data-bs-backdrop="static">
    <div class="modal-dialog modal-dialog-centered modal-lg">
        <div class="modal-content border-0 shadow-lg">
            <div class="modal-header bg-secondary text-white">
                <h5 class="modal-title">Gestión de Activo Fijo</h5>
                <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
            </div>
            <form id="form-activo">
                <div class="modal-body">
                    <input type="hidden" id="activo-id" name="id">
                    
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Placa / Código *</label>
                            <input type="text" class="form-control" id="activo-codigo" name="codigo" required>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Nombre del Activo *</label>
                            <input type="text" class="form-control" id="activo-nombre" name="nombre" required>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Categoría</label>
                            <select class="form-select" id="activo-categoria" name="categoria">
                                <option value="">Seleccione...</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Estado</label>
                            <select class="form-select" id="activo-estado" name="estado">
                                <option value="ACTIVO">Activo / En Uso</option>
                                <option value="MANTENIMIENTO">En Mantenimiento</option>
                                <option value="BAJA">De Baja</option>
                                <option value="VENDIDO">Vendido</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Ubicación</label>
                            <input type="text" class="form-control" id="activo-ubicacion" name="ubicacion" placeholder="Oficina, Bodega...">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label small fw-bold">Responsable</label>
                            <input type="text" class="form-control" id="activo-responsable" name="responsable">
                        </div>

                        <div class="col-md-12">
                            <label class="form-label small fw-bold">Costo de Adquisición</label>
                            <div class="input-group">
                                <span class="input-group-text">$</span>
                                <input type="number" class="form-control" id="activo-costo" name="costo_adquisicion" step="0.01" min="0">
                            </div>
                        </div>
                    </div>
                </div>
                <div class="modal-footer bg-light">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" class="btn btn-primary" id="btn-guardar-activo">Guardar Activo</button>
                </div>
            </form>
        </div>
    </div>
</div>
