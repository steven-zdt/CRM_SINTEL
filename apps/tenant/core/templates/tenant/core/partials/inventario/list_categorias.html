<div class="ui-module h-100 d-flex flex-column">
    {# ⚠️ v2.40: Elemento de feedback para errores (patrón Productos) #}
    <div id="feedback-categorias-list" class="alert d-none mb-2" role="alert"></div>
    
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex align-items-center gap-2">
            <h5 class="mb-0 fw-bold text-primary"><i class="bi bi-tags me-2"></i>Categorías</h5>
            <span class="badge bg-light text-dark border">Maestro</span>
        </div>
        <div class="btn-group shadow-sm">
            {# ⚠️ v2.60: Botón HTMX para crear categoría #}
            <button type="button" class="btn btn-primary" id="btn-nuevo-categoria"
                    hx-get="/api/v1/inventario/categorias/gestor-offcanvas/" 
                    hx-target="#offcanvas-container-categorias" 
                    hx-swap="innerHTML"
                    hx-on::after-request="if(event.detail.successful){ const el = document.getElementById('offcanvas-categorias'); if(el) bootstrap.Offcanvas.getOrCreateInstance(el).show(); }">
                <i class="bi bi-plus-lg me-1"></i> Nueva Categoría
            </button>
            <button type="button" class="btn btn-outline-secondary" onclick="if(window.SintelInventarioTables?.categorias){window.SintelInventarioTables.categorias.replaceData();}">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>
    
    {# ⚠️ v2.40: Input de búsqueda para Tabulator #}
    <div class="mb-3">
        <input type="text" id="search-categoria" class="form-control" placeholder="Buscar por nombre o descripción...">
    </div>
    
    {# ⚠️ v2.40: Contenedor para Tabulator (no tabla HTML) - Alineado con productos/servicios #}
    <div id="grid-categorias" class="flex-grow-1"></div>
</div>
