<!-- Modales del módulo Contabilidad (Cuentas y Asientos) -->

<!-- Modal: Crear Cuenta -->
<div class="modal fade" id="modal-cuenta-create" tabindex="-1" aria-labelledby="modal-cuenta-create-label" aria-describedby="modal-cuenta-create-desc">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-cuenta-create-label">Crear Cuenta Contable</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div id="cuenta-modal-feedback" class="alert d-none" role="alert" aria-live="polite"></div>
        <form id="form-cuenta-create">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="cuenta-create-codigo" class="form-label">Código *</label>
              <input type="text" class="form-control" id="cuenta-create-codigo" required />
            </div>
            <div class="col-md-6 mb-3">
              <label for="cuenta-create-nombre" class="form-label">Nombre *</label>
              <input type="text" class="form-control" id="cuenta-create-nombre" required />
            </div>
            <div class="col-md-12 mb-3">
              <label for="cuenta-create-tipo" class="form-label">Tipo *</label>
              <select class="form-select" id="cuenta-create-tipo" required>
                <option value="">Seleccione...</option>
                <option value="ACTIVO">Activo</option>
                <option value="PASIVO">Pasivo</option>
                <option value="PATRIMONIO">Patrimonio</option>
                <option value="INGRESO">Ingreso</option>
                <option value="GASTO">Gasto</option>
              </select>
            </div>
            <div class="col-md-12 mb-3">
              <label for="cuenta-create-descripcion" class="form-label">Descripción</label>
              <textarea class="form-control" id="cuenta-create-descripcion" rows="3"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" data-action="confirm" data-kind="create" data-entity="cuenta">Crear</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Editar Cuenta -->
<div class="modal fade" id="modal-cuenta-edit" tabindex="-1" aria-labelledby="modal-cuenta-edit-label" aria-describedby="modal-cuenta-edit-desc">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-cuenta-edit-label">Editar Cuenta Contable</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div id="cuenta-modal-feedback" class="alert d-none" role="alert" aria-live="polite"></div>
        <form id="form-cuenta-edit">
          <input type="hidden" id="cuenta-edit-id" />
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="cuenta-edit-codigo" class="form-label">Código *</label>
              <input type="text" class="form-control" id="cuenta-edit-codigo" required />
            </div>
            <div class="col-md-6 mb-3">
              <label for="cuenta-edit-nombre" class="form-label">Nombre *</label>
              <input type="text" class="form-control" id="cuenta-edit-nombre" required />
            </div>
            <div class="col-md-12 mb-3">
              <label for="cuenta-edit-tipo" class="form-label">Tipo *</label>
              <select class="form-select" id="cuenta-edit-tipo" required>
                <option value="">Seleccione...</option>
                <option value="ACTIVO">Activo</option>
                <option value="PASIVO">Pasivo</option>
                <option value="PATRIMONIO">Patrimonio</option>
                <option value="INGRESO">Ingreso</option>
                <option value="GASTO">Gasto</option>
              </select>
            </div>
            <div class="col-md-12 mb-3">
              <label for="cuenta-edit-descripcion" class="form-label">Descripción</label>
              <textarea class="form-control" id="cuenta-edit-descripcion" rows="3"></textarea>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" data-action="confirm" data-kind="edit" data-entity="cuenta">Actualizar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Detalle Cuenta (read-only) -->
<div class="modal fade" id="modal-cuenta-detail" tabindex="-1" aria-labelledby="modal-cuenta-detail-label" aria-describedby="modal-cuenta-detail-desc">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-cuenta-detail-label">Detalle de Cuenta Contable</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="cuenta-detail-content">
        <div class="text-center text-muted py-4">Cargando...</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Crear Asiento -->
<div class="modal fade" id="modal-asiento-create" tabindex="-1" aria-labelledby="modal-asiento-create-label" aria-describedby="modal-asiento-create-desc">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-asiento-create-label">Crear Asiento Contable</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <div id="asiento-modal-feedback" class="alert d-none" role="alert" aria-live="polite"></div>
        <form id="form-asiento-create">
          <div class="row">
            <div class="col-md-6 mb-3">
              <label for="asiento-create-fecha" class="form-label">Fecha *</label>
              <input type="date" class="form-control" id="asiento-create-fecha" required />
            </div>
            <div class="col-md-6 mb-3">
              <label for="asiento-create-numero" class="form-label">Número</label>
              <input type="text" class="form-control" id="asiento-create-numero" />
            </div>
            <div class="col-md-12 mb-3">
              <label for="asiento-create-descripcion" class="form-label">Descripción *</label>
              <textarea class="form-control" id="asiento-create-descripcion" rows="3" required></textarea>
            </div>
            <div class="col-md-12 mb-3">
              <label class="form-label">Movimientos *</label>
              <div id="asiento-create-movimientos" class="border p-3">
                <p class="text-muted small">Los movimientos se agregan después de crear el asiento</p>
              </div>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-primary" data-action="confirm" data-kind="create" data-entity="asiento">Crear</button>
      </div>
    </div>
  </div>
</div>

<!-- Modal: Detalle Asiento (read-only) -->
<div class="modal fade" id="modal-asiento-detail" tabindex="-1" aria-labelledby="modal-asiento-detail-label" aria-describedby="modal-asiento-detail-desc">
  <div class="modal-dialog modal-xl">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="modal-asiento-detail-label">Detalle de Asiento Contable</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body" id="asiento-detail-content">
        <div class="text-center text-muted py-4">Cargando...</div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
      </div>
    </div>
  </div>
</div>
