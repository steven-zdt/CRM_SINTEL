{% load static %}
<!-- Modal único para importar XML (Facturas y Notas de Crédito) -->
<div class="modal fade" id="importModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="importModalTitle">Importar Documento UBL XML</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <form id="form-import-ubl">
        <div class="modal-body">
          <div class="mb-3">
            <label for="input-ubl-file" class="form-label">Archivo XML UBL 2.1</label>
            <input type="file" id="input-ubl-file" class="form-control" accept=".xml,application/xml,text/xml" required />
            <small class="text-muted d-block mb-2">Selecciona un archivo XML UBL 2.1 (Invoice o CreditNote)</small>
            <div class="alert alert-info alert-sm mb-0" role="alert">
              <i class="bi bi-info-circle"></i> <strong>Importante:</strong> Si va a cargar una Nota de Crédito, asegúrese de que la factura original ya haya sido importada previamente.
            </div>
          </div>
          
          <div id="import-feedback" class="alert d-none" role="alert" aria-live="polite"></div>
          
          <!-- Sección de preview del DTO (oculta inicialmente) -->
          <div id="import-preview-section" class="mt-3 d-none">
            <hr>
            <h6 class="mb-3">Vista Previa del DTO</h6>
            <div id="import-preview-content" class="bg-light p-3 rounded" style="max-height: 400px; overflow-y: auto;">
              <pre id="import-preview-json" class="mb-0 small"></pre>
            </div>
          </div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal" id="btn-import-cancel">Cancelar</button>
          <button type="button" class="btn btn-info" id="btn-import-preview">
            <i class="bi bi-eye"></i> Previsualizar
          </button>
          <button type="button" class="btn btn-primary" id="btn-import-save" style="display: none;">
            <i class="bi bi-save"></i> Guardar desde DTO
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
