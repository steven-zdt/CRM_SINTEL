{# offcanvas_form.html - Formulario de Proyecto (FSD v3.5) #}
{% load static %}

<div class="offcanvas offcanvas-end show" tabindex="-1" id="offcanvas-proyecto" aria-labelledby="offcanvas-proyecto-label">
    <div class="offcanvas-header">
        <h5 class="offcanvas-title" id="offcanvas-proyecto-label">
            {% if proyecto %}Editar Proyecto{% else %}Nuevo Proyecto{% endif %}
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <form id="form-proyecto" 
              {% if proyecto %}hx-put{% else %}hx-post{% endif %}="{% if proyecto %}{% url 'proyectos:proyecto-detail' proyecto.id %}{% else %}{% url 'proyectos:proyecto-list' %}{% endif %}" 
              hx-target="#form-feedback"
              hx-swap="innerHTML"
              hx-on::after-request="if(event.detail.successful && event.detail.xhr.status >= 200 && event.detail.xhr.status < 300) { bootstrap.Offcanvas.getInstance(document.getElementById('offcanvas-proyecto')).hide(); window.location.href = '/workspace/#proyectos'; }"
              hx-indicator="#btn-guardar-proyecto">
            {% csrf_token %}
            
            <!-- Feedback del formulario -->
            <div id="form-feedback" class="mb-3"></div>
            
            <!-- Código -->
            <div class="mb-3">
                <label for="codigo" class="form-label">Código</label>
                <input type="text" class="form-control" id="codigo" name="codigo" 
                       value="{{ proyecto.codigo|default:'' }}" required>
            </div>
            
            <!-- Nombre -->
            <div class="mb-3">
                <label for="nombre" class="form-label">Nombre del Proyecto</label>
                <input type="text" class="form-control" id="nombre" name="nombre" 
                       value="{{ proyecto.nombre|default:'' }}" required>
            </div>
            
            <!-- Tipo de Servicio -->
            <div class="mb-3">
                <label for="tipo_servicio" class="form-label">Tipo de Servicio</label>
                <select class="form-select" id="tipo_servicio" name="tipo_servicio" required>
                    {% for value, label in tipos_servicio %}
                    <option value="{{ value }}" {% if proyecto.tipo_servicio == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Descripción -->
            <div class="mb-3">
                <label for="descripcion" class="form-label">Descripción</label>
                <textarea class="form-control" id="descripcion" name="descripcion" rows="3">{{ proyecto.descripcion|default:'' }}</textarea>
            </div>
            
            <!-- Cliente -->
            <div class="mb-3">
                <label for="cliente_id" class="form-label">Cliente</label>
                <select class="form-select" id="cliente_id" name="cliente_id">
                    <option value="">-- Seleccionar Cliente --</option>
                    {% for cliente in clientes %}
                    <option value="{{ cliente.id }}" 
                            {% if proyecto.cliente_id == cliente.id %}selected{% endif %}
                            data-nombre="{{ cliente.razon_social }}">
                        {{ cliente.razon_social }} ({{ cliente.numero_documento }})
                    </option>
                    {% endfor %}
                </select>
                <input type="hidden" id="cliente_nombre" name="cliente_nombre" 
                       value="{{ proyecto.cliente_nombre|default:'' }}">
            </div>
            
            <!-- Valor Contrato Proyectado -->
            <div class="mb-3">
                <label for="valor_contrato_proyectado" class="form-label">Valor Contrato Proyectado</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" class="form-control" id="valor_contrato_proyectado" 
                           name="valor_contrato_proyectado" step="0.01" min="0"
                           value="{{ proyecto.valor_contrato_proyectado|default:'0' }}">
                </div>
            </div>
            
            <!-- Fechas -->
            <div class="row mb-3">
                <div class="col-md-6">
                    <label for="fecha_inicio" class="form-label">Fecha Inicio</label>
                    <input type="date" class="form-control" id="fecha_inicio" name="fecha_inicio"
                           value="{{ proyecto.fecha_inicio|date:'Y-m-d'|default:'' }}">
                </div>
                <div class="col-md-6">
                    <label for="fecha_fin_estimada" class="form-label">Fecha Fin Estimada</label>
                    <input type="date" class="form-control" id="fecha_fin_estimada" name="fecha_fin_estimada"
                           value="{{ proyecto.fecha_fin_estimada|date:'Y-m-d'|default:'' }}">
                </div>
            </div>
            
            <!-- Fase Actual -->
            <div class="mb-3">
                <label for="fase_actual" class="form-label">Fase Actual</label>
                <select class="form-select" id="fase_actual" name="fase_actual">
                    {% for value, label in fases %}
                    <option value="{{ value }}" {% if proyecto.fase_actual == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Estado Tarea -->
            <div class="mb-3">
                <label for="estado_tarea" class="form-label">Estado de Tarea</label>
                <select class="form-select" id="estado_tarea" name="estado_tarea">
                    {% for value, label in estados_tarea %}
                    <option value="{{ value }}" {% if proyecto.estado_tarea == value %}selected{% endif %}>
                        {{ label }}
                    </option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Porcentaje Avance -->
            <div class="mb-3">
                <label for="porcentaje_avance" class="form-label">Porcentaje de Avance</label>
                <input type="range" class="form-range" id="porcentaje_avance" name="porcentaje_avance"
                       min="0" max="100" value="{{ proyecto.porcentaje_avance|default:'0' }}">
                <div class="text-center"><span id="avance-valor">{{ proyecto.porcentaje_avance|default:'0' }}</span>%</div>
            </div>
            
            <!-- Referencia Factura -->
            <div class="mb-3">
                <label for="factura_ref" class="form-label">Referencia Factura</label>
                <input type="text" class="form-control" id="factura_ref" name="factura_ref"
                       value="{{ proyecto.factura_ref|default:'' }}">
            </div>
            
            <div class="d-grid gap-2">
                <button type="submit" class="btn btn-primary" id="btn-guardar-proyecto">
                    <span class="spinner-border spinner-border-sm d-none" role="status" aria-hidden="true"></span>
                    {% if proyecto %}Actualizar{% else %}Crear{% endif %} Proyecto
                </button>
                <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">Cancelar</button>
            </div>
        </form>
    </div>
</div>

<script>
    // Actualizar display del rango
    document.getElementById('porcentaje_avance').addEventListener('input', function() {
        document.getElementById('avance-valor').textContent = this.value;
    });
    
    // Actualizar cliente_nombre cuando cambia el select
    document.getElementById('cliente_id').addEventListener('change', function() {
        const selected = this.options[this.selectedIndex];
        document.getElementById('cliente_nombre').value = selected.dataset.nombre || '';
    });
</script>
