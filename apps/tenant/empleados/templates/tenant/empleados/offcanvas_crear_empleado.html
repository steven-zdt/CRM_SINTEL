{# offcanvas_crear_empleado.html - Formulario de creación de Empleado v2.61 #}
{% load static %}

<div class="offcanvas offcanvas-end" tabindex="-1" id="empleadoOffcanvas" aria-labelledby="empleadoOffcanvasLabel">
    <div class="offcanvas-header border-bottom bg-light">
        <h5 class="offcanvas-title" id="empleadoOffcanvasLabel">
            <i class="bi bi-person-plus me-2"></i>Nuevo Empleado
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <div id="form-empleado-feedback" class="alert d-none mb-3" role="alert"></div>

        <form id="empleado-form" hx-post="/api/v1/empleados/"
              hx-swap="none"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-on::htmx:response-error="window.UIManager && window.UIManager.handleError && window.UIManager.handleError(event.detail, '[empleados.crear]', {errorContainerSelector: '#form-empleado-feedback'})">
            {% csrf_token %}
            
            <!-- Tipo de Documento -->
            <div class="mb-3">
                <label for="tipo_documento" class="form-label">Tipo de Documento</label>
                <select class="form-select" id="tipo_documento" name="tipo_documento" required>
                    <option value="CC">Cédula de Ciudadanía</option>
                    <option value="CE">Cédula de Extranjería</option>
                    <option value="PA">Pasaporte</option>
                    <option value="PPT">PPT</option>
                </select>
            </div>
            
            <!-- Número de Documento -->
            <div class="mb-3">
                <label for="numero_documento" class="form-label">Número de Documento</label>
                <input type="text" class="form-control" id="numero_documento" name="numero_documento" required>
            </div>
            
            <!-- Nombres -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="primer_nombre" class="form-label">Primer Nombre</label>
                    <input type="text" class="form-control" id="primer_nombre" name="primer_nombre" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="segundo_nombre" class="form-label">Segundo Nombre</label>
                    <input type="text" class="form-control" id="segundo_nombre" name="segundo_nombre">
                </div>
            </div>
            
            <!-- Apellidos -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="primer_apellido" class="form-label">Primer Apellido</label>
                    <input type="text" class="form-control" id="primer_apellido" name="primer_apellido" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="segundo_apellido" class="form-label">Segundo Apellido</label>
                    <input type="text" class="form-control" id="segundo_apellido" name="segundo_apellido">
                </div>
            </div>
            
            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" required>
            </div>
            
            <!-- Teléfono -->
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="telefono" name="telefono">
            </div>
            
            <!-- Seguridad Social -->
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="eps" class="form-label">EPS</label>
                    <select class="form-select" id="eps" name="eps" required>
                        <option value="">Seleccione...</option>
                        {% for code, name in EPS_CHOICES %}
                            <option value="{{ code }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="afp" class="form-label">Fondo de Pensión</label>
                    <select class="form-select" id="afp" name="afp" required>
                        <option value="">Seleccione...</option>
                        {% for code, name in AFP_CHOICES %}
                            <option value="{{ code }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="arl" class="form-label">ARL</label>
                    <select class="form-select" id="arl" name="arl" required>
                        <option value="">Seleccione...</option>
                        {% for code, name in ARL_CHOICES %}
                            <option value="{{ code }}">{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Nivel de Riesgo ARL -->
            <div class="mb-3">
                <label for="nivel_riesgo_arl" class="form-label">Nivel de Riesgo ARL</label>
                <select class="form-select" id="nivel_riesgo_arl" name="nivel_riesgo_arl" required>
                    {% for code, name in RIESGO_ARL_CHOICES %}
                        <option value="{{ code }}" {% if code == 'I' %}selected{% endif %}>{{ name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Vinculación Contable (v3.5) -->
            <div class="mb-3">
                <label for="cuenta_contable_search" class="form-label text-primary fw-semibold">
                    <i class="bi bi-journal-check me-1"></i>Cuenta Contable (Pasivo Nómina)
                </label>
                <div class="position-relative">
                    <div class="input-group">
                        <span class="input-group-text bg-white border-primary-subtle"><i class="bi bi-search text-primary"></i></span>
                        <input type="text" 
                               class="form-control border-primary-subtle" 
                               id="cuenta_contable_search" 
                               placeholder="Buscar por código o nombre (ej: 2505)..."
                               autocomplete="off">
                        <input type="hidden" id="cuenta_contable_uuid" name="cuenta_contable_uuid">
                    </div>
                    <div id="cuenta-contable-resultados" class="list-group position-absolute w-100 shadow-sm d-none" 
                         style="z-index: 1050; max-height: 200px; overflow-y: auto;"></div>
                </div>
                <div class="form-text small">
                    Vincule la cuenta de salarios o pasivos laborales (Nivel 6).
                </div>
            </div>
            
            <!-- Fecha de Ingreso -->
            <div class="mb-3">
                <label for="fecha_ingreso" class="form-label">Fecha de Ingreso</label>
                <input type="date" class="form-control" id="fecha_ingreso" name="fecha_ingreso" required>
            </div>
            
            <div class="offcanvas-footer border-top bg-light p-3 mt-4 mx-n3 mb-n3">
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-primary">
                        <i class="bi bi-person-plus me-1"></i>Guardar Empleado
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">Cancelar</button>
                </div>
            </div>
        </form>
    </div>
</div>
