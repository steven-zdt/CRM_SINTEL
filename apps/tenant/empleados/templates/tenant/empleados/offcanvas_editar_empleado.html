{# offcanvas_editar_empleado.html - Formulario de edición de Empleado v2.61 #}
{% load static %}

<div class="offcanvas offcanvas-end" tabindex="-1" id="empleadoOffcanvas" aria-labelledby="empleadoOffcanvasLabel">
    <div class="offcanvas-header border-bottom bg-light">
        <h5 class="offcanvas-title" id="empleadoOffcanvasLabel">
            <i class="bi bi-person-gear me-2"></i>Editar Empleado
        </h5>
        <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close"></button>
    </div>
    <div class="offcanvas-body">
        <div id="form-empleado-feedback" class="alert d-none mb-3" role="alert"></div>

        <form id="empleado-form" hx-patch="/api/v1/empleados/{{ empleado.id }}/"
              hx-swap="none"
              hx-headers='{"X-CSRFToken": "{{ csrf_token }}"}'
              hx-on::htmx:response-error="window.UIManager && window.UIManager.handleError && window.UIManager.handleError(event.detail, '[empleados.editar]', {errorContainerSelector: '#form-empleado-feedback'})">
            {% csrf_token %}
            
            <!-- Tipo de Documento -->
            <div class="mb-3">
                <label for="tipo_documento" class="form-label">Tipo de Documento</label>
                <select class="form-select" id="tipo_documento" name="tipo_documento" required>
                    <option value="CC" {% if empleado.tipo_documento == "CC" %}selected{% endif %}>Cédula de Ciudadanía</option>
                    <option value="CE" {% if empleado.tipo_documento == "CE" %}selected{% endif %}>Cédula de Extranjería</option>
                    <option value="PA" {% if empleado.tipo_documento == "PA" %}selected{% endif %}>Pasaporte</option>
                    <option value="PPT" {% if empleado.tipo_documento == "PPT" %}selected{% endif %}>PPT</option>
                </select>
            </div>
            
            <!-- Número de Documento -->
            <div class="mb-3">
                <label for="numero_documento" class="form-label">Número de Documento</label>
                <input type="text" class="form-control" id="numero_documento" name="numero_documento" value="{{ empleado.numero_documento }}" required>
            </div>
            
            <!-- Nombres -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="primer_nombre" class="form-label">Primer Nombre</label>
                    <input type="text" class="form-control" id="primer_nombre" name="primer_nombre" value="{{ empleado.primer_nombre }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="segundo_nombre" class="form-label">Segundo Nombre</label>
                    <input type="text" class="form-control" id="segundo_nombre" name="segundo_nombre" value="{{ empleado.segundo_nombre|default:'' }}">
                </div>
            </div>
            
            <!-- Apellidos -->
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label for="primer_apellido" class="form-label">Primer Apellido</label>
                    <input type="text" class="form-control" id="primer_apellido" name="primer_apellido" value="{{ empleado.primer_apellido }}" required>
                </div>
                <div class="col-md-6 mb-3">
                    <label for="segundo_apellido" class="form-label">Segundo Apellido</label>
                    <input type="text" class="form-control" id="segundo_apellido" name="segundo_apellido" value="{{ empleado.segundo_apellido|default:'' }}">
                </div>
            </div>
            
            <!-- Email -->
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ empleado.email }}" required>
            </div>
            
            <!-- Teléfono -->
            <div class="mb-3">
                <label for="telefono" class="form-label">Teléfono</label>
                <input type="text" class="form-control" id="telefono" name="telefono" value="{{ empleado.telefono|default:'' }}">
            </div>
            
            <!-- Seguridad Social -->
            <div class="row">
                <div class="col-md-4 mb-3">
                    <label for="eps" class="form-label">EPS</label>
                    <select class="form-select" id="eps" name="eps" required>
                        <option value="">Seleccione...</option>
                        {% for code, name in EPS_CHOICES %}
                            <option value="{{ code }}" {% if empleado.eps == code %}selected{% endif %}>{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="afp" class="form-label">Fondo de Pensión</label>
                    <select class="form-select" id="afp" name="afp" required>
                        <option value="">Seleccione...</option>
                        {% for code, name in AFP_CHOICES %}
                            <option value="{{ code }}" {% if empleado.afp == code %}selected{% endif %}>{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="col-md-4 mb-3">
                    <label for="arl" class="form-label">ARL</label>
                    <select class="form-select" id="arl" name="arl" required>
                        <option value="">Seleccione...</option>
                        {% for code, name in ARL_CHOICES %}
                            <option value="{{ code }}" {% if empleado.arl == code %}selected{% endif %}>{{ name }}</option>
                        {% endfor %}
                    </select>
                </div>
            </div>

            <!-- Nivel de Riesgo ARL -->
            <div class="mb-3">
                <label for="nivel_riesgo_arl" class="form-label">Nivel de Riesgo ARL</label>
                <select class="form-select" id="nivel_riesgo_arl" name="nivel_riesgo_arl" required>
                    {% for code, name in RIESGO_ARL_CHOICES %}
                        <option value="{{ code }}" {% if empleado.nivel_riesgo_arl == code %}selected{% endif %}>{{ name }}</option>
                    {% endfor %}
                </select>
            </div>
            
            <!-- Fecha de Ingreso -->
            <div class="mb-3">
                <label for="fecha_ingreso" class="form-label">Fecha de Ingreso</label>
                <input type="date" class="form-control" id="fecha_ingreso" name="fecha_ingreso" value="{{ empleado.fecha_ingreso|date:'Y-m-d' }}" required>
            </div>

            <!-- Estado -->
            <div class="mb-3">
                <label for="estado" class="form-label">Estado</label>
                <select class="form-select" id="estado" name="estado" required>
                    <option value="ACTIVO" {% if empleado.estado == "ACTIVO" %}selected{% endif %}>Activo</option>
                    <option value="VACACIONES" {% if empleado.estado == "VACACIONES" %}selected{% endif %}>En Vacaciones</option>
                    <option value="INCAPACIDAD" {% if empleado.estado == "INCAPACIDAD" %}selected{% endif %}>Incapacidad</option>
                    <option value="RETIRADO" {% if empleado.estado == "RETIRADO" %}selected{% endif %}>Retirado</option>
                </select>
            </div>
            
            <div class="offcanvas-footer border-top bg-light p-3 mt-4 mx-n3 mb-n3">
                <div class="d-grid gap-2">
                    <button type="submit" class="btn btn-success">
                        <i class="bi bi-check-lg me-1"></i>Actualizar Empleado
                    </button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">Cancelar</button>
                </div>
            </div>
        </form>
    </div>
</div>
