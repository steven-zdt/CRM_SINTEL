{% load static %}
{# mailinbox_list.html - Módulo MailInboxConfig independiente v2.37 #}
{# Consume: /api/v1/empresas/mail-inbox-config/ #}
<div id="mailinbox-module-container" class="ui-module ui-mailinbox mt-4">
  <!-- Toolbar -->
  <div class="d-flex align-items-center gap-2 mb-3" id="toolbar-mailinbox">
    <button id="btn-refrescar-mailinbox" class="btn btn-sm btn-outline-secondary">
      <i class="bi bi-arrow-repeat"></i> Refrescar
    </button>
    <div id="actions-mailinbox" class="ms-auto">
      <button class="btn btn-sm btn-primary" id="btn-mailinbox-crear" type="button">
        <i class="bi bi-plus-circle"></i> Nueva Configuración
      </button>
    </div>
  </div>
  
  <!-- Feedback -->
  <div id="feedback-mailinbox-list" class="alert d-none" role="alert"
       aria-live="polite"></div>
  
  <!-- Tabla DataTables -->
  <table id="tabla-mailinbox" class="table table-striped table-hover w-100">
    <thead>
      <tr>
        <th>Nombre</th>
        <th>Email</th>
        <th>Proveedor</th>
        <th>Host IMAP</th>
        <th>Puerto IMAP</th>
        <th>SSL</th>
        <th>Activa</th>
        <th>Estado</th>
        <th>Última Sinc.</th>
        <!-- Columna acciones (OBLIGATORIA) -->
        <th class="text-end">Acciones</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
