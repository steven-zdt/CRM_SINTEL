{# list_servicios.html - Módulo Servicios v3.5 - Nucleus #}
<div class="ui-module h-100 d-flex flex-column">
    <div id="feedback-servicios-list" class="alert d-none mb-2" role="alert"></div>
    
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex align-items-center gap-2">
            <h5 class="mb-0 fw-bold text-info"><i class="bi bi-tools me-2"></i>Servicios</h5>
            <span class="badge bg-light text-dark border">Intangibles</span>
        </div>
        <div class="btn-group shadow-sm">
            <button type="button" class="btn btn-primary" id="btn-nuevo-servicio" 
                    hx-get="/api/v1/inventario/servicios/gestor-offcanvas/" 
                    hx-target="#offcanvas-container-servicios" 
                    hx-swap="innerHTML"
                    hx-on::after-request="if(event.detail.successful){ const el = document.getElementById('offcanvas-servicios'); if(el) bootstrap.Offcanvas.getOrCreateInstance(el).show(); }">
                <i class="bi bi-plus-lg me-1"></i> Nuevo Servicio
            </button>
            <button type="button" class="btn btn-success" id="btn-registrar-historial" 
                    hx-get="/api/v1/inventario/servicios/historial-offcanvas/" 
                    hx-target="#offcanvas-container-historial-servicio" 
                    hx-swap="innerHTML"
                    hx-on::after-request="if(event.detail.successful){ const el = document.getElementById('offcanvas-historial-servicio'); if(el) bootstrap.Offcanvas.getOrCreateInstance(el).show(); }">
                <i class="bi bi-clock-history me-1"></i> Registrar Historial
            </button>
            <button type="button" class="btn btn-outline-secondary" 
                    onclick="if(window.Sintel?.Inventario?.Servicios?.List?.recargar){ window.Sintel.Inventario.Servicios.List.recargar(); } else if(window.SintelInventarioTables?.servicios){ window.SintelInventarioTables.servicios.replaceData(); }">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>
    
    <div class="mb-3">
        <input type="text" id="search-servicio" class="form-control" placeholder="Buscar por código, nombre o categoría...">
    </div>
    
    <div id="grid-servicios" class="flex-grow-1"></div>
</div>
