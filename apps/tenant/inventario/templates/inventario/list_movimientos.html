{# list_movimientos.html - Módulo Movimientos de Inventario (Kardex) v3.5 - Nucleus #}
<div class="ui-module h-100 d-flex flex-column">
    <div id="feedback-movimientos-list" class="alert d-none mb-2" role="alert"></div>
    
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex align-items-center gap-2">
            <h5 class="mb-0 fw-bold text-success"><i class="bi bi-arrow-left-right me-2"></i>Kardex</h5>
            <span class="badge bg-light text-dark border">Movimientos de Inventario</span>
        </div>
        <div class="btn-group shadow-sm">
            <button type="button" class="btn btn-success" id="btn-nuevo-movimiento"
                    hx-get="/api/v1/inventario/movimientos/gestor-offcanvas/" 
                    hx-target="#offcanvas-container-movimientos" 
                    hx-swap="innerHTML"
                    hx-on::after-request="if(event.detail.successful){ const el = document.getElementById('offcanvas-movimientos'); if(el) bootstrap.Offcanvas.getOrCreateInstance(el).show(); }">
                <i class="bi bi-plus-lg me-1"></i> Registrar Movimiento
            </button>
            <button type="button" class="btn btn-outline-secondary" 
                    onclick="if(window.Sintel?.Inventario?.Movimientos?.List?.recargar){ window.Sintel.Inventario.Movimientos.List.recargar(); } else if(window.SintelInventarioTables?.movimientos){ window.SintelInventarioTables.movimientos.replaceData(); }">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>
    
    <div class="mb-3">
        <input type="text" id="search-movimiento" class="form-control" placeholder="Buscar por producto, origen u observaciones...">
    </div>
    
    <div id="grid-movimientos" class="flex-grow-1"></div>
</div>
