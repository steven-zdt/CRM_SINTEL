{# list_movimientos.html - Ledger Universal (Timeline Unificado) v3.9.0 #}
{# Consolida Productos (Kardex), Activos Fijos (Eventos), Servicios (Historial) #}
<div class="ui-module h-100 d-flex flex-column">
    <div id="feedback-movimientos-list" class="alert d-none mb-2" role="alert"></div>

    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex align-items-center gap-2">
            <h5 class="mb-0 fw-bold text-success"><i class="bi bi-journal-text me-2"></i>Movimientos Recientes</h5>
            <span class="badge bg-success">Producto</span>
            <span class="badge bg-warning text-dark">Activo</span>
            <span class="badge bg-info text-dark">Servicio</span>
        </div>
        <div class="btn-group shadow-sm">
            <button type="button" class="btn btn-success" id="btn-nuevo-movimiento"
                    hx-get="/api/v1/inventario/movimientos/gestor-offcanvas/"
                    hx-target="#offcanvas-container-movimientos"
                    hx-swap="innerHTML"
                    hx-on::after-request="if(event.detail.successful){ sintelAbrirOffcanvas('offcanvas-movimientos'); }">
                <i class="bi bi-plus-lg me-1"></i> Registrar Movimiento
            </button>
            <button type="button" class="btn btn-outline-secondary"
                    onclick="if(window.MovimientosList?.recargar){ window.MovimientosList.recargar(); } else if(window.SintelInventarioTables?.movimientos){ window.SintelInventarioTables.movimientos.replaceData(); }">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>

    <div class="mb-3">
        <input type="text" id="search-movimiento" class="form-control"
               placeholder="Buscar por item, referencia u observaciones...">
    </div>

    <div id="grid-movimientos" class="flex-grow-1"></div>
</div>

{# Contenedor HTMX para offcanvas de movimiento #}
<div id="offcanvas-container-movimientos"></div>
