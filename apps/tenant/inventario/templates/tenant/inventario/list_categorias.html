{# list_categorias.html - Módulo Categorías v3.5 - Nucleus #}
<div class="ui-module h-100 d-flex flex-column">
    <div id="feedback-categorias-list" class="alert d-none mb-2" role="alert"></div>
    
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex align-items-center gap-2">
            <h5 class="mb-0 fw-bold text-primary"><i class="bi bi-tags me-2"></i>Categorías</h5>
            <span class="badge bg-light text-dark border">Maestro</span>
        </div>
        <div class="btn-group shadow-sm">
            <button type="button" class="btn btn-primary" id="btn-nuevo-categoria"
                    hx-get="/api/v1/inventario/categorias/gestor-offcanvas/"
                    hx-target="#offcanvas-container-categorias"
                    hx-swap="innerHTML"
                    hx-on::after-request="if(event.detail.successful){ window.Sintel?.Core?.mostrarOffcanvasSeguro('offcanvas-categorias'); }">
                <i class="bi bi-plus-lg me-1"></i> Nueva Categoría
            </button>
            <button type="button" class="btn btn-outline-secondary"
                    onclick="window.Sintel?.Inventario?.Categorias?.List?.recargar()">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>

    <div class="mb-3">
        <input type="text"
               id="search-categoria"
               class="form-control"
               placeholder="Buscar por nombre o descripción..."
               hx-get="{% url 'inventario:categoria-tabla' %}"
               hx-trigger="keyup changed delay:400ms, search"
               hx-target="#categorias-panel"
               name="q">
    </div>

    {# Tabla server-rendered (django-tables2 + HTMX) #}
    <div id="categorias-panel"
         class="flex-grow-1"
         hx-get="{% url 'inventario:categoria-tabla' %}"
         hx-trigger="load, categoria-updated from:body"
         hx-target="this"
         hx-swap="innerHTML"
         hx-boost="true">
    </div>
</div>
