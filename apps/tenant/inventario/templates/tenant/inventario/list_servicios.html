{# list_servicios.html - Módulo Servicios v3.5 - Nucleus #}
<div class="ui-module h-100 d-flex flex-column">
    <div id="feedback-servicios-list" class="alert d-none mb-2" role="alert"></div>
    
    <div class="d-flex justify-content-between align-items-center gap-2 mb-3">
        <div class="d-flex align-items-center gap-2">
            <h5 class="mb-0 fw-bold text-info"><i class="bi bi-tools me-2"></i>Servicios</h5>
            <span class="badge bg-light text-dark border">Intangibles</span>
        </div>
        <div class="btn-group shadow-sm">
            <button type="button" class="btn btn-primary" id="btn-nuevo-servicio"
                    hx-get="/api/v1/inventario/servicios/gestor-offcanvas/"
                    hx-target="#offcanvas-container-servicios"
                    hx-swap="innerHTML"
                    hx-on::after-request="if(event.detail.successful){ sintelAbrirOffcanvas('offcanvas-inventario-servicio'); }">
                <i class="bi bi-plus-lg me-1"></i> Nuevo Servicio
            </button>
            <button type="button" class="btn btn-success" id="btn-registrar-historial"
                    hx-get="/api/v1/inventario/servicios/historial-offcanvas/"
                    hx-target="#offcanvas-container-historial-servicio"
                    hx-swap="innerHTML"
                    hx-on::after-request="if(event.detail.successful){ sintelAbrirOffcanvas('offcanvas-historial-servicio'); }">
                <i class="bi bi-clock-history me-1"></i> Registrar Historial
            </button>
            <button type="button" class="btn btn-outline-secondary"
                    onclick="window.Sintel?.Inventario?.Servicios?.List?.recargar()">
                <i class="bi bi-arrow-clockwise"></i>
            </button>
        </div>
    </div>

    <div class="mb-3">
        <input type="text"
               id="search-servicio"
               class="form-control"
               placeholder="Buscar por código, nombre o categoría..."
               hx-get="{% url 'inventario:servicio-tabla' %}"
               hx-trigger="keyup changed delay:400ms, search"
               hx-target="#servicios-panel"
               name="q">
    </div>

    {# Tabla server-rendered (django-tables2 + HTMX) #}
    <div id="servicios-panel"
         class="flex-grow-1"
         style="min-width:0;overflow:hidden;"
         hx-get="{% url 'inventario:servicio-tabla' %}"
         hx-trigger="load, servicio-updated from:body"
         hx-target="this"
         hx-swap="innerHTML"
         hx-boost="true">
    </div>
</div>

{# Contenedores definidos en list_inventario.html — NO duplicar aqui #}
