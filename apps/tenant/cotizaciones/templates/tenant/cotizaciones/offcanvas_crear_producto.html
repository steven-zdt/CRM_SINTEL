{% load static %}
<div class="offcanvas-header">
  <h5 class="offcanvas-title">Nuevo Producto</h5>
  <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
</div>
<div class="offcanvas-body">
  <form id="form-producto-crear" data-endpoint="/api/v1/cotizaciones/productos/" data-method="POST">
    <div class="mb-3">
      <label for="producto-codigo" class="form-label">Código</label>
      <input type="text" id="producto-codigo" name="codigo" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="producto-nombre" class="form-label">Nombre</label>
      <input type="text" id="producto-nombre" name="nombre" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="producto-precio-venta" class="form-label">Precio de Venta</label>
      <input type="number" step="0.01" id="producto-precio-venta" name="precio_venta" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Guardar Producto</button>
  </form>
</div>

<script>
  if (window.Sintel && window.Sintel.Cotizaciones && window.Sintel.Cotizaciones.features && window.Sintel.Cotizaciones.features.productoEditor) {
    window.Sintel.Cotizaciones.features.productoEditor.init('form-producto-crear');
  }
</script>
