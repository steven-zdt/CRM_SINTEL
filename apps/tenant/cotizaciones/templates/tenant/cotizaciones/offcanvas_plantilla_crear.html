<form id="form-configuracion-crear" data-endpoint="/api/v1/cotizaciones/configuracion/" data-method="POST">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Nueva Plantilla</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body">
    <div class="mb-3">
      <label for="nombre_configuracion" class="form-label">Nombre</label>
      <input type="text" id="nombre_configuracion" name="nombre_configuracion" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="dias_validez" class="form-label">Dias de validez</label>
      <input type="number" id="dias_validez" name="dias_validez" class="form-control" min="1" max="30" value="15" required>
    </div>
    <div class="row">
        <div class="col-md-6 mb-3">
            <label for="prefijo_secuencia" class="form-label">Prefijo</label>
            <input type="text" id="prefijo_secuencia" name="prefijo_secuencia" class="form-control">
        </div>
        <div class="col-md-6 mb-3">
            <label for="sufijo_secuencia" class="form-label">Sufijo</label>
            <input type="text" id="sufijo_secuencia" name="sufijo_secuencia" class="form-control">
        </div>
    </div>
    <div class="mb-3">
      <label for="semilla_inicial" class="form-label">Semilla inicial</label>
      <input type="number" id="semilla_inicial" name="semilla_inicial" class="form-control" min="1" value="1" required>
    </div>
    <div class="form-check form-switch mb-3">
      <input class="form-check-input" type="checkbox" id="es_activo" name="es_activo" checked>
      <label class="form-check-label" for="es_activo">Activa</label>
    </div>
    <button type="submit" id="btn-configuracion-crear-submit" class="btn btn-primary w-100">Guardar plantilla</button>
  </div>
</form>

<script>
  if (window.Sintel && window.Sintel.Cotizaciones && window.Sintel.Cotizaciones.features && window.Sintel.Cotizaciones.features.configuracionEditor) {
    window.Sintel.Cotizaciones.features.configuracionEditor.init('form-configuracion-crear');
  }
</script>
