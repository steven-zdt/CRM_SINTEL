{% load static %}
<div class="offcanvas-header">
  <h5 class="offcanvas-title">{% if instance %}Editar Servicio{% else %}Nuevo Servicio{% endif %}</h5>
  <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
</div>
<div class="offcanvas-body">
  <form id="form-servicio-crear"
        data-endpoint="{% if instance %}/api/v1/cotizaciones/servicios/{{ instance.uuid }}/{% else %}/api/v1/cotizaciones/servicios/{% endif %}"
        data-method="{% if instance %}PATCH{% else %}POST{% endif %}">
    <div class="mb-3">
      <label for="servicio-nombre" class="form-label">Nombre del Servicio</label>
      <input type="text" id="servicio-nombre" name="nombre" class="form-control" value="{{ instance.nombre|default:'' }}" required>
    </div>
    <div class="mb-3">
      <label for="servicio-precio-venta" class="form-label">Precio de Venta</label>
      {# Ver comentario equivalente en offcanvas_crear_producto.html: bug
         real de locale (coma decimal invalida un input type=number). #}
      <input type="number" step="0.01" id="servicio-precio-venta" name="precio_venta" class="form-control" value="{{ instance.precio_venta|default_if_none:''|stringformat:'s' }}" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">{% if instance %}Guardar Cambios{% else %}Guardar Servicio{% endif %}</button>
  </form>
</div>

<script>
  if (window.Sintel && window.Sintel.Cotizaciones && window.Sintel.Cotizaciones.features && window.Sintel.Cotizaciones.features.servicioEditor) {
    window.Sintel.Cotizaciones.features.servicioEditor.init('form-servicio-crear');
  }
</script>
