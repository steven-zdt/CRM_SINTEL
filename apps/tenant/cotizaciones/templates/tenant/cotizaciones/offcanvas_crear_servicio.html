{% load static %}
<div class="offcanvas-header">
  <h5 class="offcanvas-title">Nuevo Servicio</h5>
  <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
</div>
<div class="offcanvas-body">
  <form id="form-servicio-crear" data-endpoint="/api/v1/cotizaciones/servicios/" data-method="POST">
    <div class="mb-3">
      <label for="servicio-nombre" class="form-label">Nombre del Servicio</label>
      <input type="text" id="servicio-nombre" name="nombre" class="form-control" required>
    </div>
    <div class="mb-3">
      <label for="servicio-precio-venta" class="form-label">Precio de Venta</label>
      <input type="number" step="0.01" id="servicio-precio-venta" name="precio_venta" class="form-control" required>
    </div>
    <button type="submit" class="btn btn-primary w-100">Guardar Servicio</button>
  </form>
</div>

<script>
  if (window.Sintel && window.Sintel.Cotizaciones && window.Sintel.Cotizaciones.features && window.Sintel.Cotizaciones.features.servicioEditor) {
    window.Sintel.Cotizaciones.features.servicioEditor.init('form-servicio-crear');
  }
</script>
