{# list.html - Listado principal de Cotizaciones v2.61.8 #}
{# Assets se cargan desde workspace.html, NO incluir aqui para evitar doble carga #}
<div class="ui-module ui-cotizaciones" role="region" aria-label="Modulo de Cotizaciones">
  <div class="d-flex justify-content-between align-items-center gap-2 mb-3" id="toolbar-cotizaciones">
    <div class="btn-group shadow-sm">
      <button type="button" class="btn btn-primary" id="btn-cotizaciones-crear"
        hx-get="/cotizaciones/editor/draft/"
        hx-target="#offcanvas-container"
        hx-swap="innerHTML"
        hx-indicator="#spinner">
        <i class="bi bi-plus-lg me-1"></i> Nueva Cotizacion
      </button>
      <button type="button" class="btn btn-outline-secondary"
        hx-get="/cotizaciones/partials/configuracion/crear/"
        hx-target="#offcanvas-container">
        <i class="bi bi-plus-circle me-1"></i> Nueva Plantilla
      </button>
      <button type="button" class="btn btn-outline-secondary"
        hx-get="/cotizaciones/partials/configuracion/lista/"
        hx-target="#offcanvas-container">
        <i class="bi bi-gear me-1"></i> Configuración
      </button>
    </div>
    <div class="input-group" style="max-width: 300px;">
      <span class="input-group-text"><i class="bi bi-search"></i></span>
      <input type="text" class="form-control" id="search-cotizacion" placeholder="Buscar cotizacion...">
    </div>
  </div>
  <div id="tabla-cotizaciones-principal" class="table-responsive tabulator-sintel flex-grow-1" data-url="/api/v1/cotizaciones/" data-page-size="20" style="min-height: 400px; width: 100%; overflow-x: auto;" role="grid" aria-label="Tabla de cotizaciones"></div>
  <div id="offcanvas-container" class="offcanvas offcanvas-end" tabindex="-1" aria-labelledby="offcanvas-cotizacion-label" style="width: 90%; max-width: 1200px;"></div>
</div>

{# Modal de confirmacion de eliminacion #}
<div class="modal fade" id="modal-eliminar-cotizacion" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">Confirmar eliminacion</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
      </div>
      <div class="modal-body">
        <p>Esta seguro de que desea eliminar esta cotizacion? Esta accion no se puede deshacer.</p>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
        <button type="button" class="btn btn-danger" id="btn-confirmar-eliminar-cotizacion">Eliminar</button>
      </div>
    </div>
  </div>
</div>
