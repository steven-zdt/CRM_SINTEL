<form id="form-cotizacion-crear" data-endpoint="/api/v1/cotizaciones/" data-method="POST">
  <div class="offcanvas-header">
    <h5 class="offcanvas-title">Nueva Cotización</h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body">
    <div class="mb-3">
      <label for="cliente" class="form-label">Cliente</label>
      <select id="cliente_select" class="form-select" required onchange="document.getElementById('cliente').value = this.value">
        <option value="">Seleccione un cliente</option>
        {% for cliente in clientes %}
        <option value="{{ cliente.uuid }}">{{ cliente.razon_social }}</option>
        {% endfor %}
      </select>
      <input type="hidden" id="cliente" name="cliente" value="">
    </div>
    <div class="mb-3">
      <div class="d-flex justify-content-between align-items-center mb-1">
        <label for="configuracion" class="form-label mb-0">Configuración</label>
        <button type="button" class="btn btn-link btn-sm p-0 text-decoration-none"
                hx-get="/cotizaciones/partials/configuracion/crear/"
                hx-target="#offcanvas-container">
          <i class="bi bi-plus-circle"></i> Nueva Plantilla
        </button>
      </div>
      <select id="configuracion_select" class="form-select" required onchange="document.getElementById('configuracion').value = this.value">
        <option value="">Seleccione una configuración</option>
        {% for configuracion in configuraciones %}
        <option value="{{ configuracion.uuid }}">{{ configuracion.nombre_configuracion }}</option>
        {% endfor %}
      </select>
      <input type="hidden" id="configuracion" name="configuracion" value="">
    </div>
    <div class="mb-3">
      <label for="fecha_emision" class="form-label">Fecha de emisión</label>
      <input type="date" id="fecha_emision" name="fecha_emision" class="form-control">
    </div>
    <button type="submit" id="btn-cotizacion-crear-submit" class="btn btn-success w-100">Guardar Cotización</button>
  </div>
</form>
