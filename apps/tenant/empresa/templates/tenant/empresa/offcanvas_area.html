{# offcanvas_area.html - Offcanvas del módulo Área v2.60 #}
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvas-area" aria-labelledby="offcanvas-area-label" style="width: 500px;">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="offcanvas-area-label">
      <i class="bi bi-diagram-3-fill me-2"></i>
      <span id="offcanvas-area-titulo">{% if is_edit %}Editar Área{% else %}Nueva Área{% endif %}</span>
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body">
    <div id="form-area-feedback" class="alert alert-danger d-none mb-3" role="alert"></div>
    
    <form id="form-area" method="POST" onsubmit="return false;">
      <input type="hidden" id="area-id" name="id" value="{% if is_edit %}{{ area.id }}{% endif %}">
      <input type="hidden" id="area-uuid" name="uuid" value="{% if is_edit %}{{ area.uuid }}{% endif %}">
      
      <div class="mb-4">
        <h6 class="text-primary border-bottom pb-2 mb-3">
          <i class="bi bi-info-circle me-2"></i>Información del Área
        </h6>
        <div class="row g-3">
          <div class="col-md-12">
            <label for="area-sede" class="form-label">Sede *</label>
            <select class="form-select" id="area-sede" name="sede" required>
              <option value="" disabled {% if not is_edit %}selected{% endif %}>-- Seleccionar Sede --</option>
              {% for s in sedes %}
                <option value="{{ s.uuid }}" {% if is_edit and area.sede.uuid == s.uuid %}selected{% endif %}>{{ s.nombre }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-12">
            <label for="area-nombre" class="form-label">Nombre del Área *</label>
            <input type="text" class="form-control" id="area-nombre" name="nombre" 
                   value="{% if is_edit %}{{ area.nombre }}{% endif %}" 
                   required placeholder="Ej. Contabilidad, Ventas, Recursos Humanos" />
          </div>
          <div class="col-md-12">
            <label for="area-codigo_funcionamiento" class="form-label">Código de Funcionamiento *</label>
            <input type="text" class="form-control" id="area-codigo_funcionamiento" name="codigo_funcionamiento" 
                   value="{% if is_edit %}{{ area.codigo_funcionamiento }}{% endif %}" 
                   required placeholder="Ej. FIN-01, VTA-02" />
            <div class="form-text">Código único que identifica a esta área en la sede.</div>
          </div>
        </div>
      </div>
      
      <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">
          <i class="bi bi-x-circle me-1"></i>Cancelar
        </button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-area">
          <i class="bi bi-check-circle me-1"></i>Guardar
        </button>
      </div>
    </form>
  </div>
</div>
