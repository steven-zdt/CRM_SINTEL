{# offcanvas_sede.html - Offcanvas del módulo Sede v2.60 #}
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvas-sede" aria-labelledby="offcanvas-sede-label" style="width: 500px;">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="offcanvas-sede-label">
      <i class="bi bi-geo-fill me-2"></i>
      <span id="offcanvas-sede-titulo">{% if is_edit %}Editar Sede{% else %}Nueva Sede{% endif %}</span>
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body">
    <div id="form-sede-feedback" class="alert alert-danger d-none mb-3" role="alert"></div>
    
    <form id="form-sede" method="POST" onsubmit="return false;">
      <input type="hidden" id="sede-id" name="id" value="{% if is_edit %}{{ sede.id }}{% endif %}">
      <input type="hidden" id="sede-uuid" name="uuid" value="{% if is_edit %}{{ sede.uuid }}{% endif %}">
      
      <div class="mb-4">
        <h6 class="text-primary border-bottom pb-2 mb-3">
          <i class="bi bi-info-circle me-2"></i>Información de la Sede
        </h6>
        <div class="row g-3">
          <div class="col-md-12">
            <label for="sede-nombre" class="form-label">Nombre de Sede *</label>
            <input type="text" class="form-control" id="sede-nombre" name="nombre" 
                   value="{% if is_edit %}{{ sede.nombre }}{% endif %}" 
                   required placeholder="Ej. Principal, Norte, Bodega Centro" />
          </div>
          <div class="col-md-12">
            <label for="sede-direccion" class="form-label">Dirección</label>
            <input type="text" class="form-control" id="sede-direccion" name="direccion" 
                   value="{% if is_edit %}{{ sede.direccion }}{% endif %}" 
                   placeholder="Ej. Calle 100 # 15-20" />
          </div>
          <div class="col-md-12">
            <label for="sede-telefono" class="form-label">Teléfono</label>
            <input type="text" class="form-control" id="sede-telefono" name="telefono" 
                   value="{% if is_edit %}{{ sede.telefono }}{% endif %}" 
                   placeholder="Ej. 601234567" />
          </div>
          <div class="col-md-12">
            <label for="sede-encargado_nombre" class="form-label">Nombre del Encargado</label>
            <input type="text" class="form-control" id="sede-encargado_nombre" name="encargado_nombre" 
                   value="{% if is_edit %}{{ sede.encargado_nombre }}{% endif %}" 
                   placeholder="Nombre de la persona a cargo" />
          </div>
        </div>
      </div>
      
      <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">
          <i class="bi bi-x-circle me-1"></i>Cancelar
        </button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-sede">
          <i class="bi bi-check-circle me-1"></i>Guardar
        </button>
      </div>
    </form>
  </div>
</div>
