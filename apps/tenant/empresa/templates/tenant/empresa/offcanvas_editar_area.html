{# offcanvas_editar_area.html - Offcanvas EDITAR Area v4.2 (FSD §7.1) #}
<div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvas-area" aria-labelledby="offcanvas-area-label"
     data-area-uuid="{{ area.uuid }}" style="width: 500px;">
  <div class="offcanvas-header border-bottom">
    <h5 class="offcanvas-title" id="offcanvas-area-label">
      <i class="bi bi-diagram-3-fill me-2 text-primary"></i>Editar Area
    </h5>
    <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
  </div>
  <div class="offcanvas-body">
    <div id="form-area-feedback" class="alert alert-danger d-none mb-3" role="alert"></div>

    <form id="form-area" method="POST" onsubmit="return false;">
      <input type="hidden" id="area-id"   name="id"   value="{{ area.id }}">
      <input type="hidden" id="area-uuid" name="uuid" value="{{ area.uuid }}">

      <div class="mb-4">
        <h6 class="text-primary border-bottom pb-2 mb-3">
          <i class="bi bi-info-circle me-2"></i>Informacion del Area
        </h6>
        <div class="row g-3">
          <div class="col-md-12">
            <label for="area-sede" class="form-label">Sede *</label>
            <select class="form-select" id="area-sede" name="sede" required>
              <option value="" disabled>-- Seleccionar Sede --</option>
              {% for s in sedes %}
                <option value="{{ s.id }}" {% if area.sede_id == s.id %}selected{% endif %}>{{ s.nombre }}</option>
              {% endfor %}
            </select>
          </div>
          <div class="col-md-12">
            <label for="area-nombre" class="form-label">Nombre del Area *</label>
            <input type="text" class="form-control" id="area-nombre" name="nombre"
                   required value="{{ area.nombre }}">
          </div>
          <div class="col-md-12">
            <label for="area-codigo_funcionamiento" class="form-label">Codigo de Funcionamiento *</label>
            <input type="text" class="form-control" id="area-codigo_funcionamiento" name="codigo_funcionamiento"
                   required value="{{ area.codigo_funcionamiento }}">
            <div class="form-text">Codigo unico que identifica a esta area en la sede.</div>
          </div>
        </div>
      </div>

      <div class="d-flex justify-content-end gap-2 mt-4 pt-3 border-top">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="offcanvas">
          <i class="bi bi-x-circle me-1"></i>Cancelar
        </button>
        <button type="submit" class="btn btn-primary" id="btn-guardar-area">
          <i class="bi bi-floppy me-1"></i>Actualizar Area
        </button>
      </div>
    </form>
  </div>
</div>
