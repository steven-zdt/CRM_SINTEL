# Bloque HTTP — entrada principal para Cloudflare Tunnel (y red local sin cert instalado)
#
# Cloudflare Tunnel envía tráfico HTTP a nginx:80 con X-Forwarded-Proto: https.
# Django lee ese header (SECURE_PROXY_SSL_HEADER) y construye URLs HTTPS correctas.
# NO redirigir 80->443 aquí: causaría loop infinito con cloudflared.
server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $upstream http://web:8000;

    # Descarga del cert para clientes de red local (instalar como CA de confianza)
    location = /sintel.crt {
        alias /etc/nginx/certs/sintel.crt;
        add_header Content-Type "application/x-x509-ca-cert";
        add_header Content-Disposition "attachment; filename=sintel.crt";
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        alias /app/staticfiles/;
        # Remediacion cache-desactualizada (auditoria 2026-08-06): "expires 30d" +
        # Cache-Control "public" hacia que el navegador NUNCA revalidara estos
        # archivos durante 30 dias, sin importar cambios en el codigo fuente --
        # cualquier fix de JS/CSS quedaba invisible para usuarios que ya hubieran
        # visitado el sitio. nginx ya emite ETag/Last-Modified reales del archivo
        # en disco; "no-cache" fuerza revalidacion condicional en cada carga
        # (barata: responde 304 si no cambio, sirve el archivo nuevo de inmediato
        # si cambio), sin perder el beneficio de cache para el caso comun.
        add_header Cache-Control "no-cache, public, no-transform";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        proxy_pass            $upstream;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # Cloudflare ya envia X-Forwarded-Proto: https — preservarlo.
        # Para acceso directo HTTP sin Cloudflare, forzar "https" igual
        # para que Django construya URLs correctas en ambos modos.
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

# Bloque HTTPS — acceso con SSL (opcional, para quien tenga el cert instalado)
server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/sintel.crt;
    ssl_certificate_key /etc/nginx/certs/sintel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    resolver 127.0.0.11 valid=5s ipv6=off;
    set $upstream http://web:8000;

    location /static/ {
        alias /app/staticfiles/;
        # Ver nota de remediacion en el bloque HTTP (puerto 80) de este mismo archivo.
        add_header Cache-Control "no-cache, public, no-transform";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        proxy_pass            $upstream;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
