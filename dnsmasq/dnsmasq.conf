# DNS Wildcard para tenants locales de Sintel CRM
# Todos los subdominios *.sintel.com resuelven a 192.168.2.15
# Cambia SERVER_IP si el servidor tiene otra IP.

# === UPSTREAM DNS ===
no-resolv
server=8.8.8.8
server=8.8.4.4
server=1.1.1.1

# === WILDCARD LOCAL ===
# *.sintel.com y sintel.com → este servidor
address=/.sintel.com/192.168.2.15

# === INTERFAZ ===
listen-address=0.0.0.0
bind-dynamic

# === FIABILIDAD ===
# TTL bajo para que cambios propaguen rapido en desarrollo
local-ttl=30
neg-ttl=30

# Cache de hasta 1000 respuestas
cache-size=1000

# === LOGS ===
log-queries
log-facility=-
