; supervisord.conf -- orquesta los 9 procesos del contenedor unico de
; DESARROLLO (decision explicita del usuario, 2026-09-22: SOLO dev,
; produccion sigue en docker-compose.prod.yaml con servicios separados).
;
; priority=: orden de arranque (menor = primero). supervisord no tiene un
; equivalente nativo a "depends_on: condition: service_healthy" de Compose --
; cada programa dependiente usa docker/wait-for.sh para esperar activamente
; antes de arrancar de verdad, sin importar el orden real de arranque de
; supervisord (defensa en profundidad, no solo la prioridad).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── Capa 1: almacenamiento (arrancan primero) ───────────────────────────────

[program:postgres]
priority=10
command=/usr/local/bin/docker-start-postgres.sh
user=postgres
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:redis]
priority=10
command=redis-server --bind 0.0.0.0 --protected-mode no --dir /data/redis
user=appuser
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Capa 2: apps que dependen de Postgres/Redis ─────────────────────────────

[program:django]
priority=20
command=/usr/local/bin/docker-start-django.sh
user=appuser
directory=/app
autorestart=true
startsecs=5
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery]
priority=25
command=bash -c "/app/docker/wait-for.sh tcp localhost 6379 -- celery -A config worker -l info -Q high_priority,default"
user=appuser
directory=/app
environment=SERVICE_ROLE="celery",C_FORCE_ROOT="1"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:celery-beat]
priority=25
command=bash -c "/app/docker/wait-for.sh tcp localhost 6379 -- celery -A config beat -l info"
user=appuser
directory=/app
environment=SERVICE_ROLE="celery-beat",C_FORCE_ROOT="1"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:neo4j]
priority=20
command=/usr/local/bin/docker-start-neo4j.sh
user=appuser
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:n8n]
priority=30
command=bash -c "/app/docker/wait-for.sh postgres localhost 5432 -- n8n start"
user=appuser
environment=HOME="/home/appuser"
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

; ── Capa 3: entrada (nginx depende de django, cloudflared de nginx) ─────────

[program:nginx]
priority=40
command=/usr/local/bin/docker-start-nginx.sh
user=root
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:cloudflared]
priority=50
command=bash -c "/app/docker/wait-for.sh tcp localhost 80 -- cloudflared tunnel --no-autoupdate run"
user=appuser
autorestart=true
startretries=3
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
