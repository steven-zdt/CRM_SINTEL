# docker/nginx-single.conf -- config de nginx SOLO para el contenedor unico de
# desarrollo (docker-compose.single.yaml). Copia deliberada de nginx/nginx.conf
# (ese archivo sigue siendo del nginx MULTI-contenedor -- resolver 127.0.0.11 +
# "web" como nombre DNS de Compose) con un unico cambio real: aqui nginx y
# Django corren como procesos del MISMO contenedor via supervisord, sin red de
# Compose de por medio, asi que el upstream es 127.0.0.1:8000 directo y no
# hace falta el `resolver` (no hay DNS embebido de Docker que consultar).
server {
    listen 80;
    server_name _;

    client_max_body_size 50M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    set $upstream http://127.0.0.1:8000;

    location = /sintel.crt {
        alias /etc/nginx/certs/sintel.crt;
        add_header Content-Type "application/x-x509-ca-cert";
        add_header Content-Disposition "attachment; filename=sintel.crt";
        add_header Cache-Control "no-cache";
    }

    location /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "no-cache, public, no-transform";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        proxy_pass            $upstream;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}

server {
    listen 443 ssl;
    server_name _;

    ssl_certificate     /etc/nginx/certs/sintel.crt;
    ssl_certificate_key /etc/nginx/certs/sintel.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 50M;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_buffers 16 8k;
    gzip_http_version 1.1;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    set $upstream http://127.0.0.1:8000;

    location /static/ {
        alias /app/staticfiles/;
        add_header Cache-Control "no-cache, public, no-transform";
        access_log off;
    }

    location /media/ {
        alias /app/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    location / {
        proxy_pass            $upstream;
        proxy_read_timeout    120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
